# gitleaks config for the sindustries repo.
#
# Purpose: catch real secrets before they reach `git push`. AC2 of task
# 206927ed calls out a source-control guard; this file plus
# scripts/install-hooks.sh (local pre-commit) and the gitleaks CI job
# in .github/workflows/ci.yml (server-side) cover that AC.
#
# The default ruleset already catches X_API_KEY=..., AKAHU_CLIENT_SECRET=...,
# BUDET_API_TOKEN_KEY=... etc. when assigned a non-empty value. The
# `allowlist` block below covers the value shapes we KNOW is fine:
#   - empty `KEY=` lines used to document a contract.
#   - common placeholder words in docs and comments.
#
# There is NO global path allowlist. The global `[allowlist]` table
# suppresses no file path at all, so every tracked file is scanned by
# every rule and the merge gate's claim — a secret committed into any
# tracked file fails the required job — holds literally. The two
# subtree-shaped path entries that used to live here
# (`tests/.*/fixtures/.*` and `services/.*/test/.*\.test\.[jt]sx?$`)
# suppressed live findings and were removed by task 46211c26. The
# contract test now rejects any allowlist path whose non-final segment
# is a glob, so a subtree-wide suppression cannot come back.
#
# The allowlist is intentionally narrow — every entry here has a reason.
# Do NOT add broad allowlists; the value of this scan is its strictness.

title = "sindustries gitleaks config"

[extend]
# Load the bundled default ruleset.
#
# `useDefault` defaults to FALSE from gitleaks v8.19 onwards, so this line
# is load-bearing: without it the config ships with no rules at all. The
# repo's scan therefore detected nothing — a real `API_KEY=sk_live_...`
# was not flagged, while the default ruleset flags it. That made the
# merge gate's "secret scan" a green check that could not fail.
# (Found while implementing task 2b3962b1, which turns that gate on.)
useDefault = true
# Anything not listed here falls through to gitleaks' built-in rules.

[allowlist]
description = "Value shapes we know are fine: empty `KEY=` documentation lines and common placeholder words."
stopwords = [
  # Common placeholder phrases that appear in docs/comments; not secrets.
  "example",
  "placeholder",
  "your-value-here",
  "replace-me",
  "REPLACE_ME",
  "change-me",
  "CHANGEME",
]

# Regex allowlist: an empty-value documentation line looks like `KEY=`
# (no value, just an equals sign). The default ruleset flags the line
# itself because the regex pattern matches `KEY=...`. Allowlist the
# specific shape `^[A-Z][A-Z0-9_]*\s*=\s*$`. The shape is matched, not
# the file: an empty assignment carries no value to disclose, so this
# suppresses nothing in any file that holds a real value.
regexes = [
  '''^\s*[A-Z][A-Z0-9_]*\s*=\s*$''',
]

# Per-rule overrides: any rule can be relaxed for specific file paths
# via the rules section. Keep these to a minimum.
#
# The two overrides that used to live here (`generic-api-key` and
# `AKAHU_CLIENT_SECRET`, both aimed at empty placeholders in
# .env.example) were removed while implementing task 2b3962b1. They were
# inert: a custom rule's pattern is read from `regex` (singular), and the
# plural `regexes` form is ignored, so both rules carried a path and no
# pattern at all. The noise they were written for is covered by the
# empty-assignment regex above, so removing them restores the bundled
# rules at full strength rather than narrowing them.

# Rule-scoped allowlists for the repository-wide triage findings of task
# 46211c26. Every entry matches one rule and one exact path. A
# commit-scoped entry adds one exact commit; a value-scoped entry adds
# the exact reviewed value shapes. A new commit, a different path, a
# different value, or a different rule is still scanned. The per-finding
# triage and remediation state is recorded in
# docs/runbooks/secret-scan-triage.md.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "False positive: destructured hashToken identifier in the historical GymTrack OAuth branch."
  condition = "AND"
  commits = ["5e6fc702547e343f09587d634ba1757923136aae"]
  paths = ['''apps/gymtrack/api/oauth/token\.js$''']

  [[rules.allowlists]]
  description = "Elided, non-usable credential prefix in the historical W26 audit finding."
  condition = "AND"
  commits = [
    "6a59bec3a472e89303fa28f34d38eeee6018fb1b",
    "6819c8fef2567790c6759101d0c4e093af10e22b",
  ]
  paths = ['''docs/repo-audits/2026-W26\.md$''']

  # `condition = "AND"` is load-bearing here, not decoration. A gitleaks
  # allowlist's default condition is OR, and under OR the `paths` entry
  # alone matches, so the whole file is suppressed and a different
  # credential committed to it would pass the gate unnoticed. Under AND
  # the finding must match BOTH the exact file AND one of the exact value
  # shapes, so a different value in this file — and any value in any
  # other file — is still scanned. Verified against the shipped config:
  # with AND, a fresh secret in this file is detected; without it, it is
  # not.
  #
  # This entry is scoped to the exact VALUE rather than to an exact
  # commit, and that is deliberate rather than a shortcut. The tree
  # scope is the merge-gate input and it scans a directory, not a
  # commit: `gitleaks dir` produces findings with no commit metadata,
  # so a commit-scoped allowlist cannot suppress a tree-scope finding at
  # all. Scoping by value is also the narrower of the two — it names the
  # exact literals that are not credentials instead of suppressing a
  # whole file at a whole commit.
  #
  # The two literals are anchored (`^...$`) on purpose. An unanchored
  # pattern would also match any value that merely contains one of them,
  # so the anchors are what make "a different value in this file is
  # still detected" true rather than merely intended.
  [[rules.allowlists]]
  description = "Reviewed false positives: two hard-coded fixture values in the content-scheduler API's CTO-Craft import-route test read as API keys. The exact file and the exact anchored value shapes are named, and the AND condition means both must match, so a different value in this file — and any value in any other file — is still scanned."
  condition = "AND"
  regexTarget = "secret"
  regexes = [
    '''^test\-secret\-1234567890$''',
    '''^wrong\-secret\-1234567$''',
  ]
  paths = ['''services/content-scheduler-api/test/contentSchedulerImport\.test\.ts$''']

# Test-only detection rule (task 2b3962b1). The canary token is a
# distinctive, non-credential marker used by the secret-scan negative
# control to prove the merge gate actually fails on a finding. It only
# ever ADDS a detection — it suppresses nothing — and the marker is
# synthetic, so publishing it on a throwaway branch for the duration of
# the control leaks nothing.
#
# The rule is scoped to the one path the canary is ever written to
# (`infra/cloud/secret-scan-canary.txt`), which the allowlist above does
# not cover, so the control cannot be defeated by an allowlist entry.
# The path scope also matters in the other direction: an unscoped rule
# would match the token wherever it is mentioned, including in the
# contract test that holds the token as a literal, and the gate would
# then fail on the repository's own test source.
[[rules]]
id = "sindustries-secret-scan-canary"
description = "Test-only detection rule for the secret-scan enforcement canary. Adds a detection; it never suppresses one."
regex = '''SINDUSTRIES_SECRET_SCAN_CANARY_[A-Z0-9]{16,}'''
path = '''infra/cloud/secret-scan-canary\.txt$'''
entropy = 2.0

  [[rules.allowlists]]
  description = "Synthetic canary commits published by prior negative-control pull requests."
  condition = "AND"
  commits = [
    "4cc7c358795f6d3230b91b668a657146acbadf54",
    "8485bb99d6dd7340bec81fb5d17e3e675dd59002",
    "7c9615a621eafa8bee07bd4819bb4136d7eb91e7",
  ]
  paths = ['''infra/cloud/secret-scan-canary\.txt$''']
