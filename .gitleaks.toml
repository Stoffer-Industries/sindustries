# gitleaks config for the sindustries repo.
#
# Purpose: catch real secrets before they reach `git push`. AC2 of task
# 206927ed calls out a source-control guard; this file plus
# scripts/install-hooks.sh (local pre-commit) and the gitleaks CI job
# in .github/workflows/ci.yml (server-side) cover that AC.
#
# The default ruleset already catches X_API_KEY=..., AKAHU_CLIENT_SECRET=...,
# BUDET_API_TOKEN_KEY=... etc. when assigned a non-empty value. The
# `allowlist` block below covers the noise we KNOW is fine:
#   - .env.example empty-value lines (KEY=) used to document the contract.
#   - test fixtures that intentionally include fake values (CI test names).
#
# The allowlist is intentionally narrow — every entry here has a reason.
# Do NOT add broad allowlists; the value of this scan is its strictness.

title = "sindustries gitleaks config"

[extend]
# Load the bundled default ruleset.
#
# `useDefault` defaults to FALSE from gitleaks v8.19 onwards, so this line
# is load-bearing: without it the config ships with no rules at all. The
# repo's scan therefore detected nothing — a real `API_KEY=sk_live_...`
# was not flagged, while the default ruleset flags it. That made the
# merge gate's "secret scan" a green check that could not fail.
# (Found while implementing task 2b3962b1, which turns that gate on.)
useDefault = true
# Anything not listed here falls through to gitleaks' built-in rules.

[allowlist]
description = "Noise we know is fine: empty .env.example lines + test fixtures."
paths = [
  '''\.env\.example$''',         # .env.example empty-value lines (KEY=)
  '''\.env\.example\.template$''', # ditto for any *.template variants
  '''tests/.*/fixtures/.*''',     # test fixtures with fake secret values
  '''services/.*/test/.*\.test\.[jt]sx?$''' # test files referencing secret-name strings
]
stopwords = [
  # Common placeholder phrases that appear in docs/comments; not secrets.
  "example",
  "placeholder",
  "your-value-here",
  "replace-me",
  "REPLACE_ME",
  "change-me",
  "CHANGEME",
]

# Regex allowlist: empty-value lines in .env.example look like `KEY=`
# (no value, just an equals sign). The default ruleset flags the line
# itself because the regex pattern matches `KEY=...`. Allowlist the
# specific shape `^[A-Z][A-Z0-9_]*\s*=\s*$` on .env.example files.
regexes = [
  '''^\s*[A-Z][A-Z0-9_]*\s*=\s*$''',
]

# Per-rule overrides: any rule can be relaxed for specific file paths
# via the rules section. Keep these to a minimum.
#
# The two overrides that used to live here (`generic-api-key` and
# `AKAHU_CLIENT_SECRET`, both aimed at empty placeholders in
# .env.example) were removed while implementing task 2b3962b1. They were
# inert: a custom rule's pattern is read from `regex` (singular), and the
# plural `regexes` form is ignored, so both rules carried a path and no
# pattern at all. The noise they were written for is already covered by
# the global allowlist above — the `.env.example` path and the
# empty-assignment regex — so removing them restores the bundled rules at
# full strength rather than narrowing them.

# Test-only detection rule (task 2b3962b1). The canary token is a
# distinctive, non-credential marker used by the secret-scan negative
# control to prove the merge gate actually fails on a finding. It only
# ever ADDS a detection — it suppresses nothing — and the marker is
# synthetic, so publishing it on a throwaway branch for the duration of
# the control leaks nothing.
#
# The rule is scoped to the one path the canary is ever written to
# (`infra/cloud/secret-scan-canary.txt`), which the allowlist above does
# not cover, so the control cannot be defeated by an allowlist entry.
# The path scope also matters in the other direction: an unscoped rule
# would match the token wherever it is mentioned, including in the
# contract test that holds the token as a literal, and the gate would
# then fail on the repository's own test source.
[[rules]]
id = "sindustries-secret-scan-canary"
description = "Test-only detection rule for the secret-scan enforcement canary. Adds a detection; it never suppresses one."
regex = '''SINDUSTRIES_SECRET_SCAN_CANARY_[A-Z0-9]{16,}'''
path = '''infra/cloud/secret-scan-canary\.txt$'''
entropy = 2.0
