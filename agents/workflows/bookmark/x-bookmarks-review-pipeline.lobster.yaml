name: x-bookmarks-review-pipeline

# Ingest, summarise, and route bookmarks through the approval pipeline.
#
# Summarize replaces generate_reviews — faithful extraction, no classification.
# Spec generation happens asynchronously in Quinn's heartbeat (spec_requested → spec files).
# This pipeline runs through to the approval gate so the lobster resume token
# is available when Tom approves a spec.

args:
  sourceRoot:
    default: brain/bookmarks/x
  reviewsRoot:
    default: brain/bookmarks/summaries
  specsRoot:
    default: brain/bookmarks/specs
  limit:
    default: 25
  source:
    default: any
  dryRun:
    default: false
  approvalTopic:
    default: general

steps:
  - id: list_curate_candidates
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_list_curate_candidates.py
      --source-root ${sourceRoot}
      --source ${source}
      --limit ${limit}
      --json

  - id: summarize
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_summarize.py
      --reviews-root ${reviewsRoot}
      --json
    stdin: $list_curate_candidates.stdout

  - id: list_curations
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_list_curations.py --json
    stdin: $summarize.stdout

  - id: generate_specs
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_generate_specs.py
      --specs-root ${specsRoot}
      --json
    stdin: $list_curations.stdout

  - id: prepare_topic_approval
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_prepare_topic_approval.py
      --approval-topic ${approvalTopic}
      --json
    stdin: $generate_specs.stdout

  - id: ensure_topic_slot_available
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_ensure_topic_slot_available.py --json
    stdin: $prepare_topic_approval.stdout

  - id: finalize_review_cycle
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_finalize_review_cycle.py --json
    stdin: $ensure_topic_slot_available.stdout

  - id: compact_approval_preview
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_compact_approval_preview.py
    stdin: $ensure_topic_slot_available.stdout
    approval: required

  - id: create_tasks_from_proposals
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_create_tasks_from_proposals.py
      --base-url ${TASKS_API_BASE_URL}
      --json
    stdin: $ensure_topic_slot_available.stdout
    condition: $compact_approval_preview.approved

  - id: resolve_topic_approval
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/lobster_resolve_topic_approval.py
      --decision approve
      --json
    stdin: $create_tasks_from_proposals.stdout
    condition: $compact_approval_preview.approved
