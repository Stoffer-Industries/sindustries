[project]
name = "cto-craft-workflow"
version = "0.1.0"
description = "Weekly LangGraph pipeline that turns Tech Manager Weekly's latest issue into Content Scheduler draft tweets, aligned with Tom's worldview."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [
  { name = "Sindustries" }
]
dependencies = [
  "langgraph>=0.3.21,<0.4.0",
  "langgraph-checkpoint-postgres>=2.0.10,<3.0.0",
  "psycopg[binary]>=3.1.18,<4.0.0",
  "httpx>=0.27.0,<0.29.0",
  "beautifulsoup4>=4.12.3,<5.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "python-dateutil>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "respx>=0.21.1,<0.23.0",
  "types-python-dateutil>=2.9.0",
]
# Studio-only dependency: the LangGraph CLI is only required when an
# operator wants to run `langgraph dev` locally for graph inspection.
# Production cron / CI never install this extra, keeping the runtime
# venv clean. Pin the CLI to a version pair compatible with the
# runtime LangGraph floor above; this resolves the historical
# USE_RUNTIME_CONTEXT_API crash when a fresh `uv sync` previously
# resolved incompatible langgraph + langgraph-cli versions.
studio = [
  "langgraph-cli[inmem]==0.3.6",
  # Keep the in-memory server on the matching pre-runtime-context pair.
  # Later runtime-inmem releases read a flag absent from API 0.2.102.
  "langgraph-api==0.2.102",
  "langgraph-runtime-inmem==0.6.0",
]

[project.scripts]
cto-craft-workflow = "cto_craft_workflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cto_craft_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
  "ignore::DeprecationWarning:langgraph.*",
  "ignore::DeprecationWarning:langchain.*",
]
