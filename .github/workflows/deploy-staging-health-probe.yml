# GitHub Actions: deploy health-probe to Fly.io staging.
#
# Triggered by the central CI workflow when infra/cloud/observability/**
# or packages/otel-node/** changes land on main. Mirrors the existing
# deploy-staging-tasks-api.yml workflow pattern:
#   - FLY_API_TOKEN referenced as a repo secret, never hardcoded.
#   - Canary deploy with a /healthz smoke check (the probe exposes its
#     own health route; that is the http_check target in fly.toml).
#
# Quinn-owned: FLY_API_TOKEN must be registered once as a repo secret
# in the staging GitHub environment.

name: Deploy health-probe (Fly.io staging)

on:
  workflow_call:

concurrency:
  group: deploy-health-probe-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FLY_APP: sindustries-health-probe-staging
  FLY_CONFIG: infra/cloud/observability/health-probe/fly.toml

jobs:
  deploy:
    name: Deploy health-probe to Fly.io staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require Fly deployment credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN is not configured for the staging GitHub environment. Add it through Settings > Environments > staging > Environment secrets."
            exit 1
          fi

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.102

      - name: Validate fly.toml
        working-directory: .
        run: flyctl config validate --config ${{ env.FLY_CONFIG }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy (canary)
        working-directory: .
        run: flyctl deploy --config ${{ env.FLY_CONFIG }} --strategy canary --wait-timeout 600
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke check (/healthz)
        id: smoke
        run: |
          set -euo pipefail
          URL="https://${{ env.FLY_APP }}.fly.dev/healthz"
          STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${URL}")"
          if [ "${STATUS}" != "200" ]; then
            echo "::error::smoke check failed: GET ${URL} returned ${STATUS}"
            exit 1
          fi
          echo "smoke=ok"
          echo "smoke_url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: success()
        run: |
          echo "### health-probe deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${{ env.FLY_APP }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: ${{ steps.smoke.outputs.smoke_url }}" >> "$GITHUB_STEP_SUMMARY"
