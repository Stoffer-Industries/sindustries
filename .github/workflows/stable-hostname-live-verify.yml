# GitHub Actions: stable hostname live verification (task 5cb4a8fe, AC5).
#
# Why this workflow exists
# -----------------------
# The AC5 live hostname harness (tests/cloud/scripts/stable-hostname-verification.mjs)
# has so far only run from the operator's Mac, which sits behind a secret
# egress proxy. Every request to a *.sindustries.co.nz host from there comes
# back 502 with the body "Secret egress proxy could not reach the upstream
# host", which the harness classifies as failureMode=proxy_blocked — an
# observer-side block, not a deployment verdict. With the proxy unset the same
# two frontend rows fail as failureMode=transport_error.
#
# Neither observation can close the AC5 frontend clause ("frontend roots and
# assets work through the stable hostnames") or the AC2 TLS clause
# ("certificates valid for every public hostname"): both need one run from a
# host that is simply on the public internet, with nothing in the request path
# between the runner and the deployment.
#
# This workflow is that path. It is deliberately narrow:
#   * workflow_dispatch only — never on push, pull_request or schedule, so it
#     can never fire unattended against a moving deployment.
#   * No deploy. It does not touch the Fly or Vercel control planes.
#   * No credentials. The harness performs DNS resolution, an HTTPS GET on a
#     health endpoint and a CORS preflight; it never reads a token, so this
#     job needs no `environment:` and no secret reference of any kind. The
#     contract test asserts that no such reference is ever added. The checkout
#     itself also runs with `persist-credentials: false`, so the implicit
#     GITHUB_TOKEN is never written into `.git/config` for a later step to
#     pick up.
#   * The proxy environment variables are cleared explicitly and NO_PROXY is
#     pinned, so the request path is provably direct even if a runner image
#     or an org-level runner configuration sets one. The cleared list is the
#     repository's own direct-egress policy (the six standard HTTP proxy
#     variables, the CA-bundle variables `agents/lib/github-cli.sh` and
#     `infra/cloud/bin/status` drop, and the host-specific egress variables
#     `HUMAN_PROXY` / `SECRET_EGRESS_PROXY`) and the contract test pins the
#     complete list.
#   * The evidence is bound to the commit the run actually executed: the
#     checkout is pinned to the dispatched commit, the resolved commit is
#     asserted against the requested one, and the harness records that
#     commit in the result JSON the artifact carries.
#   * The redacted result JSON is uploaded as a run artifact, including when
#     the harness reports a failure, because a failing run is the evidence.
#
# The result is AC5 evidence, not an AC5 assertion: the two Vercel frontend
# rows are expected to fail while `infra/cloud/hostname-matrix.json` names
# Vercel projects that do not exist — the staging deployments that do exist
# sit under different project names, and which project owns the stable
# hostname is Quinn's pending decision. A failing row here is the honest
# signal that the surface is not serving as the matrix describes; the
# workflow produces evidence, it does not assert an AC.

name: Stable hostname live verification (task 5cb4a8fe)

on:
  workflow_dispatch:
    inputs:
      intent_commit:
        description: 'Commit SHA this run verifies (default: the dispatched commit)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: stable-hostname-live-verify
  cancel-in-progress: false

jobs:
  verify:
    name: AC5 live hostname verification (public-internet runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Never persist the implicit GITHUB_TOKEN: this job needs no
          # credential, and a token left in .git/config is a credential the
          # workflow does not know it holds.
          persist-credentials: false
          # Verify exactly the commit this run claims to verify. An empty
          # intent_commit falls back to the dispatched commit (github.sha).
          ref: ${{ github.event.inputs.intent_commit || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve the commit under test
        id: commit
        env:
          REQUESTED_COMMIT: ${{ github.event.inputs.intent_commit }}
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          requested="${REQUESTED_COMMIT}"
          if [[ -n "${requested}" ]]; then
            if [[ ! "${requested}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::intent_commit must be a 40-character lowercase commit SHA"
              exit 1
            fi
            if [[ "${requested}" != "${resolved}" ]]; then
              echo "::error::checked out commit ${resolved} does not match intent_commit ${requested}"
              exit 1
            fi
          fi
          echo "commit=${resolved}" >> "$GITHUB_OUTPUT"
          echo "verifying commit ${resolved}"

      - name: Run the live hostname harness with a direct request path
        id: harness
        env:
          VERIFY_COMMIT: ${{ steps.commit.outputs.commit }}
          RESULT_PATH: ${{ runner.temp }}/stable-hostname-verification.json
        run: |
          set -o pipefail
          # Nothing may sit between this runner and the deployment: a proxy
          # in the path answers before the request leaves the runner and
          # turns a deployment verdict into failureMode=proxy_blocked.
          # The cleared set is the complete direct-egress list: the six
          # standard HTTP proxy variables, the CA-bundle variables the
          # repository's own direct-egress wrappers drop, and the
          # host-specific egress variables.
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy \
                HUMAN_PROXY SECRET_EGRESS_PROXY human_proxy secret_egress_proxy \
                SSL_CERT_FILE SSL_CERT_DIR
          export NO_PROXY='*' no_proxy='*'
          echo "proxy env after clear: HTTP_PROXY=${HTTP_PROXY:-unset} HTTPS_PROXY=${HTTPS_PROXY:-unset} ALL_PROXY=${ALL_PROXY:-unset}"

          status=0
          node tests/cloud/scripts/stable-hostname-verification.mjs \
            --mode live \
            --run-id "stable-hostname-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --intent-commit "${VERIFY_COMMIT}" \
            --output "${RESULT_PATH}" > /dev/null || status=$?
          echo "harness_exit=${status}" >> "$GITHUB_OUTPUT"

          if [[ -f "${RESULT_PATH}" ]]; then
            node -e '
              const fs = require("node:fs");
              const r = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, "utf8"));
              const expected = process.env.VERIFY_COMMIT;
              if (expected && r.intentCommit !== expected) {
                console.error("::error::result intentCommit " + r.intentCommit + " does not match the executed commit " + expected);
                process.exit(3);
              }
              console.log("verdict=" + r.verdict + " mode=" + r.mode + " runId=" + r.runId + " commit=" + r.intentCommit);
              for (const s of (r.surfaces || [])) {
                const why = (s.details && (s.details.failureMode || s.details.reason)) || "";
                console.log("- " + s.id + ": " + s.status + (why ? " (" + why + ")" : ""));
              }
              for (const b of (r.productionBlockers || [])) {
                console.log("production blocker: " + b.code + " (owner " + b.owner + ")");
              }
            '
          else
            echo "::error::harness produced no result JSON at ${RESULT_PATH}"
            status=2
          fi

          exit "${status}"

      - name: Upload the redacted result JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-hostname-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stable-hostname-verification.json
          if-no-files-found: error
          retention-days: 14
