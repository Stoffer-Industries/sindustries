name: secret scan history

# The repository-wide secret scan (task 46211c26).
#
# The merge gate scans the change and the tracked tree. This workflow
# covers the surface the gate cannot: the published history. It runs on a
# weekly schedule and on demand, and it is an ALERTING surface — it is
# not an input to the `merge gate` job, and a failure here does not block
# a merge.
#
# The trade is deliberate. A full-history scan on every pull request is
# too slow to run on every run, and a history-only finding must not block
# a merge that does not contain it. The timely surface is the gate (which
# now covers the tree); this is the backstop for history-only findings.
#
# Every surface calls the same entrypoint, infra/cloud/scripts/run-secret-scan.sh,
# with the same config and the same pinned binary
# (infra/cloud/scripts/install-gitleaks.sh), so the detection policy
# cannot drift between the gate and this schedule.

on:
  schedule:
    # Weekly, Monday 03:17 UTC. The exact minute is arbitrary; the point
    # is a predictable, once-a-week sweep of the published refs.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One sweep at a time: two concurrent history scans would publish
  # competing artifacts for the same refs.
  group: secret-scan-history
  cancel-in-progress: false

jobs:
  secret-scan-history:
    name: repository secret scan (history + tree)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch every published branch and tag
        # The history scope is every commit reachable from a published
        # branch or tag. Pull-request head refs are deliberately excluded:
        # they contain transient synthetic negative-control commits and
        # are not part of the repository's published branch/tag history.
        # `--all` in the entrypoint then covers exactly the refs fetched
        # here.
        run: |
          set -euo pipefail
          git fetch --prune --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          echo "secret scan history: $(git rev-list --count --all) commit(s) in scope"

      - name: Resolve the pinned gitleaks release
        id: pin
        run: bash infra/cloud/scripts/install-gitleaks.sh --print-pin

      - name: Cache the pinned gitleaks archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/sindustries-gitleaks
          key: gitleaks-cli-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Install gitleaks CLI (pinned)
        run: bash infra/cloud/scripts/install-gitleaks.sh

      - name: Scan the published history
        id: history
        run: |
          bash infra/cloud/scripts/run-secret-scan.sh --history \
            --report "$RUNNER_TEMP/secret-scan-reports/history.json"

      - name: Scan the tracked tree
        # Runs even when the history scan failed, so one run produces a
        # report for both scopes and a single failure does not hide the
        # other scope's result. The job still fails: a failed step fails
        # the job.
        if: always()
        run: |
          bash infra/cloud/scripts/run-secret-scan.sh --tree \
            --report "$RUNNER_TEMP/secret-scan-reports/tree.json"

      - name: Summarise the findings
        if: always()
        run: |
          python3 infra/cloud/scripts/render-secret-scan-summary.py \
            --history "$RUNNER_TEMP/secret-scan-reports/history.json" \
            --tree "$RUNNER_TEMP/secret-scan-reports/tree.json" \
            --out "$RUNNER_TEMP/secret-scan-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the redacted findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-findings-${{ github.run_id }}
          path: ${{ runner.temp }}/secret-scan-reports
          if-no-files-found: warn
          retention-days: 30
