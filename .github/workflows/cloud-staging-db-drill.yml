# .github/workflows/cloud-staging-db-drill.yml
#
# Cloud staging database transfer + restore drill (task d37681e1).
# workflow_dispatch only — never runs on push or schedule.
#
# Required secrets (configured on the staging GitHub Environment):
#   * TASKS_API_SOURCE_DSN            — read-only DSN for source tasks_api
#   * BUDGET_API_SOURCE_DSN           — read-only DSN for source budget_api
#   * TASKS_API_DEST_DSN              — owner DSN for destination tasks_api
#   * BUDGET_API_DEST_DSN             — owner DSN for destination budget_api
#   * RECOVERY_TASKS_API_DSN          — owner DSN for recovery tasks_api
#                                       (only required when --recovery)
#   * RECOVERY_BUDGET_API_DSN         — owner DSN for recovery budget_api
#                                       (only required when --recovery)
#
# Required environment variables (configured on the staging GitHub Environment):
#   * ENVIRONMENT — must equal "staging"
#   * PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING — "1" (skip offline cache check)

name: cloud-staging-db-drill

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: 'Also restore into a recovery DB and re-reconcile.'
        required: false
        type: boolean
        default: false
      interruption:
        description: 'Run a single interruption drill: dump, restore, or none.'
        required: false
        type: string
        default: 'none'
      cleanup_destination:
        description: 'DESTRUCTIVE: before restore, drop and recreate the tasks_api and budget_api schemas in the destination database so the restore target is empty. Use only when a previous failed drill left pre-existing objects in the destination. Two-key auth: the workflow sets CLEANUP_DESTINATION=1 only when this is true, and the drill script also requires --cleanup-destination.'
        required: false
        type: boolean
        default: false

concurrency:
  group: cloud-staging-database
  cancel-in-progress: false

jobs:
  drill:
    name: Drill
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      ENVIRONMENT: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install repository deps
        run: npm ci

      - name: Install PostgreSQL 18 client and shellcheck
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18 shellcheck
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Lint cloud database scripts
        run: npm run lint:cloud-db

      - name: Write DSNs to mode-0600 files
        env:
          TASKS_SOURCE: ${{ secrets.TASKS_API_SOURCE_DSN }}
          BUDGET_SOURCE: ${{ secrets.BUDGET_API_SOURCE_DSN }}
          TASKS_DEST: ${{ secrets.TASKS_API_DEST_DSN }}
          BUDGET_DEST: ${{ secrets.BUDGET_API_DEST_DSN }}
          TASKS_RECOVERY: ${{ secrets.RECOVERY_TASKS_API_DSN }}
          BUDGET_RECOVERY: ${{ secrets.RECOVERY_BUDGET_API_DSN }}
        run: |
          set -euo pipefail
          required=(TASKS_SOURCE BUDGET_SOURCE TASKS_DEST BUDGET_DEST)
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            required+=(TASKS_RECOVERY BUDGET_RECOVERY)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required staging environment secret for $name is missing or empty" >&2
              exit 11
            fi
          done
          mkdir -p "$RUNNER_TEMP/cloud-staging-secrets"
          chmod 0700 "$RUNNER_TEMP/cloud-staging-secrets"
          for pair in \
              "tasks-source:tasks.dsn:$TASKS_SOURCE" \
              "budget-source:budget.dsn:$BUDGET_SOURCE" \
              "tasks-dest:tasks-dest.dsn:$TASKS_DEST" \
              "budget-dest:budget-dest.dsn:$BUDGET_DEST"; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            file="${rest%%:*}"
            value="${rest#*:}"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" > "$RUNNER_TEMP/cloud-staging-secrets/$name-$file"
              chmod 0600 "$RUNNER_TEMP/cloud-staging-secrets/$name-$file"
            fi
          done
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            printf '%s' "$TASKS_RECOVERY"  > "$RUNNER_TEMP/cloud-staging-secrets/tasks-recovery.dsn"
            chmod 0600 "$RUNNER_TEMP/cloud-staging-secrets/tasks-recovery.dsn"
            printf '%s' "$BUDGET_RECOVERY" > "$RUNNER_TEMP/cloud-staging-secrets/budget-recovery.dsn"
            chmod 0600 "$RUNNER_TEMP/cloud-staging-secrets/budget-recovery.dsn"
          fi

      - name: Pre-flight safety checks
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          [[ "$ENVIRONMENT" == "staging" ]] || { echo "ENVIRONMENT must be staging"; exit 10; }
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          psql --version | grep -q '18\.'

      - name: Run the drill
        env:
          ENVIRONMENT: staging
          CLOUD_DB_DRILL_INTERRUPTION: ${{ inputs.interruption }}
          # Two-key auth for the destructive cleanup-destination
          # operator action. The workflow only sets this when the
          # operator has explicitly opted in via the
          # cleanup_destination workflow_dispatch input; the drill
          # script also requires the matching --cleanup-destination
          # flag at the call site. Both keys are required.
          CLEANUP_DESTINATION: ${{ inputs.cleanup_destination == true && '1' || '' }}
        run: |
          set -euo pipefail
          SEC="$RUNNER_TEMP/cloud-staging-secrets"
          RECOVERY_FLAG=""
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            RECOVERY_FLAG="--recovery"
          fi
          CLEANUP_FLAG=""
          if [[ "${{ inputs.cleanup_destination }}" == "true" ]]; then
            CLEANUP_FLAG="--cleanup-destination"
          fi
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-$(openssl rand -hex 3)"
          export CLOUD_DB_RUN_ID="$RUN_ID"
          ./scripts/cloud/database/drill.sh \
            --source-tasks-dsn-file  "$SEC/tasks-source-tasks.dsn" \
            --source-budget-dsn-file "$SEC/budget-source-budget.dsn" \
            --dest-tasks-dsn-file    "$SEC/tasks-dest-tasks-dest.dsn" \
            --dest-budget-dsn-file   "$SEC/budget-dest-budget-dest.dsn" \
            --confirm "$RUN_ID" \
            --interruption "${{ inputs.interruption }}" \
            $RECOVERY_FLAG \
            $CLEANUP_FLAG \
            --archive-dir "$RUNNER_TEMP/cloud-staging-artifacts" \
            --output      "$RUNNER_TEMP/cloud-staging-artifacts/drill-final.json"

      - name: Capture restore failure logs
        if: failure()
        run: |
          set -euo pipefail
          # On any drill failure, the pg_restore log lives at a relative
          # path (`./artifacts/cloud-staging/restore-*.log`) that the
          # upload step globs do not pick up. Copy every restore log the
          # drill wrote into the upload directory so the actual
          # pg_restore error text surfaces as an artifact, and tail the
          # last one into the step summary so it is visible inline in
          # the GitHub UI without downloading.
          mkdir -p "$RUNNER_TEMP/cloud-staging-artifacts"
          shopt -s nullglob
          found=0
          for src_log in ./artifacts/cloud-staging/restore-*.log \
                          "$RUNNER_TEMP/cloud-staging-artifacts/restore-"*.log; do
            [ -e "$src_log" ] || continue
            cp -v "$src_log" "$RUNNER_TEMP/cloud-staging-artifacts/" || true
            found=1
          done
          if (( found == 1 )); then
            last="$(ls -1t "$RUNNER_TEMP/cloud-staging-artifacts/restore-"*.log 2>/dev/null | head -n1 || true)"
            if [ -n "$last" ] && [ -e "$last" ]; then
              {
                echo "### restore failure detail"
                echo
                echo "Source log: \`${last##*/}\`"
                echo
                echo '```'
                tail -300 "$last" || true
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload redacted result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-staging-db-drill-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloud-staging-artifacts/*.json
            ${{ runner.temp }}/cloud-staging-artifacts/*.sha256
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if reconcile FAILED
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/cloud-staging-artifacts/reconcile-*.json"
          if compgen -G "$f" >/dev/null; then
            latest=$(ls -1t $f | head -n1)
            verdict=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).verdict || 'unknown')" "$latest")
            if [[ "$verdict" != "PASS" ]]; then
              echo "reconcile verdict=$verdict; failing the workflow"
              exit 20
            fi
          fi
