name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      tasks_api: ${{ steps.filter.outputs.tasks_api }}
      budget_api: ${{ steps.filter.outputs.budget_api }}
      auto_post_worker: ${{ steps.filter.outputs.auto_post_worker }}
      gymtrack: ${{ steps.filter.outputs.gymtrack }}
      gymtrack_mcp: ${{ steps.filter.outputs.gymtrack_mcp }}
      budget_mobile: ${{ steps.filter.outputs.budget_mobile }}
      feature_task: ${{ steps.filter.outputs.feature_task }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed deployable surfaces
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            website:
              - 'apps/website/**'
              - 'packages/design-tokens/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.json'
              - '.github/workflows/website-deploy.yml'
            tasks_api:
              - 'services/tasks-api/**'
              - 'packages/otel-node/**'
              - 'package.json'
              - 'package-lock.json'
              - 'infra/cloud/**'
              - '.github/workflows/deploy-staging-tasks-api.yml'
            budget_api:
              - 'services/budget-api/**'
              - 'packages/budget-domain/**'
              - 'package.json'
              - 'package-lock.json'
              - 'infra/cloud/**'
              - '.github/workflows/deploy-staging-budget-api.yml'
            auto_post_worker:
              - 'services/content-scheduler-api/**'
              - 'packages/otel-node/**'
              - 'package.json'
              - 'package-lock.json'
              - 'infra/cloud/**'
              - '.github/workflows/deploy-staging-auto-post-worker.yml'
            gymtrack:
              - 'apps/gymtrack/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/gymtrack-deploy.yml'
            gymtrack_mcp:
              - 'services/gymtrack-mcp/**'
              - 'apps/gymtrack/server/agentData.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/gymtrack-mcp-deploy.yml'
            budget_mobile:
              - 'apps/budget-mobile/**'
              - 'packages/budget-domain/**'
              - 'package.json'
              - 'package-lock.json'
            feature_task:
              - 'agents/workflows/feature-task/**'

  python-workflow-tests:
    name: python workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python workflow tests
        env:
          PYTHONPATH: >-
            agents/skills/tasks-api-ops:agents/workflows/bookmarks/scripts:agents/lib
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/scripts/tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/tests -p 'test_*.py'
          python -m unittest discover -s agents/lib -p 'test_*.py'
          python -m unittest discover -s agents/workflows/content-tasks/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/scripts -p 'test_*.py'

  cto-craft-tweet-drafts-tests:
    # W34 audit QW1: the cto-craft-tweet-drafts LangGraph pipeline holds
    # the most safety-relevant new code in this workflow (SSRF-safe fetcher,
    # advisory-lock durability, graph wiring). The package's pytest suite
    # (`test_safe_fetch.py`, `test_durability.py`, `test_graph.py`, plus
    # extraction/angle-model/issue-source tests) was never wired into CI,
    # which is why the SSRF rebinding gap and the ingest-secret auth
    # collision landed silently. Adding this job so PRs touching
    # `agents/workflows/cto-craft-tweet-drafts/**` are validated against
    # the existing pytest+respx+pytest-asyncio suite.
    #
    # Mirrors the W33 gymtrack-mcp-tests pattern (parallel dedicated job)
    # rather than folding into `python-workflow-tests` because:
    #   1. This suite is pytest-based with fixture-parametrized tests,
    #      `respx`, and `pytest-asyncio`; adding it to the existing
    #      `python -m unittest discover` step would error mid-discover.
    #   2. The workflow pins `requires-python = ">=3.11,<3.13"`; 3.12
    #      satisfies that range.
    #   3. Deps are pinned in `uv.lock`, so `uv sync --frozen --extra dev`
    #      installs reproducibly from the lockfile (no network lock step).
    #
    # W35 audit follow-up (task 60971f78): the cto-craft-tweet-drafts
    # production cron now uses a real `langgraph.checkpoint.postgres.
    # PostgresSaver` against `CTO_CRAFT_LANGGRAPH_DATABASE_URL`. A
    # regression test that exercises the actual Postgres checkpoint
    # path (rather than the in-memory stub used elsewhere in the suite)
    # is in `tests/test_postgres_saver_send_serialization.py`; it
    # `pytest.skip`s locally when the env var is unset and only runs in
    # CI under this job's `services.postgres`. Without this services
    # block the new test would always skip and the Send-serialization
    # regression that motivated task 60971f78 would land silently again.
    name: cto-craft-tweet-drafts tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cto_craft_langgraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cto_craft_langgraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CTO_CRAFT_LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cto_craft_langgraph
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install workflow dependencies
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv sync --frozen --extra dev

      - name: Run pytest
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv run --frozen --extra dev pytest

  otel-node-tests:
    name: otel-node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run otel-node tests
        run: npm test --workspace @sindustries/otel-node

  mission-control-tests:
    name: mission-control tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run mission-control tests
        run: npm test --workspace @sindustries/mission-control

  tasks-api-tests:
    name: tasks-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Check Prisma migration prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Run unit tests
        run: npm test --workspace services/tasks-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/tasks-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/tasks-api

      - name: Run DB integration tests
        run: npm run test:integration --workspace services/tasks-api

  content-scheduler-api-tests:
    # W35 audit QW1: the content-scheduler-api service owns the
    # `content_scheduler` Postgres schema plus the in-process + BullMQ
    # auto-post adapters. The package's `npm test` script (vitest, six
    # files) was never wired into CI, which is why several extraction
    # readiness gaps landed silently. Adding this job so
    # `services/content-scheduler-api/**` changes are validated against
    # the existing vitest suite on every PR. Mirrors the
    # tasks-api-tests / budget-api-tests pattern: postgres service
    # container, DATABASE_URL pinned to `?schema=content_scheduler`,
    # `prisma:migrate deploy` to materialise the schema before the
    # supertest-instantiated app boots. Prisma is still mocked per-test
    # via `vi.mock('../src/lib/prisma.ts')`, so no DB integration step
    # is required — the schema just needs to exist so the Prisma
    # client can construct at module load.
    name: content-scheduler-api tests (vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_content_scheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_content_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_content_scheduler?schema=content_scheduler
      OTEL_SDK_DISABLED: '1'
      X_CLIENT: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/content-scheduler-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/content-scheduler-api

      - name: Run vitest suite
        run: npm test --workspace services/content-scheduler-api

  feature-task-workflow-tests:
    name: feature-task workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Run feature-task tests
        run: cargo test --manifest-path agents/workflows/feature-task/Cargo.toml

  ash-tests:
    name: ash verifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/ash/package-lock.json

      - name: Install agents/ash dependencies
        run: npm ci --prefix agents/ash

      - name: Run ash verifier tests
        run: npm test --prefix agents/ash

  budget-api-unit:
    # W38 audit T0/F4 — renamed from `budget-api-tests` and split off the
    # misleading "(unit + db integration)" label. The job now honestly
    # declares its scope: budget-api unit tests + the budget-domain and
    # budget-mobile checks the workspace already declared but CI never
    # ran. The real-DB integration suite lives in the sibling
    # `budget-api-db-integration` job below. See docs/repo-audits/2026-W38.md
    # finding F4 for the audit trail.
    name: budget-api unit + domain/mobile checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Run unit tests
        run: npm test --workspace services/budget-api

      # W38 audit F4 AC1: CI now runs the budget-domain and budget-mobile
      # checks the rest of the workspace already declared. These three steps
      # are what the old "unit + db integration" job claimed to cover but
      # never actually exercised.
      - name: Run packages/budget-domain tests
        run: npm test --workspace packages/budget-domain

      - name: Run packages/budget-domain typecheck
        run: npm run typecheck --workspace packages/budget-domain

      - name: Run apps/budget-mobile typecheck
        run: npm run typecheck --workspace apps/budget-mobile

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

  budget-api-db-integration:
    # W38 audit F4 AC2/AC3: the existing `ownership-contract.test.ts`
    # suite mocks Prisma entirely, so real DB-layer bugs (mistyped fields,
    # missing `where`, broken transaction boundaries) silently pass CI.
    # This job runs a parallel test file
    # (`services/budget-api/test/ownership-contract-integration.test.ts`)
    # against the same Postgres service the unit job provisions, with
    # Akahu HTTP stubs so no real outbound network is required. The test
    # self-skips when `BUDGET_API_INTEGRATION_TEST` is unset so local
    # developers running `npm test` against a non-existent DB are not
    # broken. The unit job deliberately does not set this env var.
    name: budget-api db integration (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
      BUDGET_API_INTEGRATION_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

      - name: Run ownership-contract integration (real DB)
        run: npm test --workspace services/budget-api -- ownership-contract-integration

  tasks-app-tests:
    name: tasks app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks

      - name: Run unit/component tests
        run: npm test --workspace apps/tasks

  tasks-app-e2e:
    name: tasks app e2e (ui + api + db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Apply DB migrations + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
        run: |
          npm run prisma:migrate --workspace services/tasks-api
          npm run prisma:seed --workspace services/tasks-api

      - name: Start tasks-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
          PORT: 4000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          ALLOW_PORT_DB_MISMATCH: "1"
          OTEL_SDK_DISABLED: "1"
        run: npm run start --workspace services/tasks-api > /tmp/tasks-api.log 2>&1 &

      - name: Wait for tasks-api
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4000/health && exit 0
            sleep 2
          done
          echo "tasks-api failed to start"
          cat /tmp/tasks-api.log
          exit 1

      - name: Install Playwright browser + system deps
        run: npm exec --workspace apps/tasks playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          CI: true
        run: npm run test:e2e --workspace apps/tasks

      - name: Dump tasks-api logs on failure
        if: failure()
        run: cat /tmp/tasks-api.log

  website-app-tests:
    name: website app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/website

      - name: Run unit tests
        run: npm test --workspace apps/website

      - name: Check content image links
        run: npm run check:content-links --workspace apps/website

      - name: Build website
        run: npm run build --workspace apps/website

  gymtrack-tests:
    name: gymtrack tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/gymtrack

      - name: Run unit/component tests
        run: npm test --workspace apps/gymtrack

  gymtrack-mcp-tests:
    # W33 audit QW1: the gymtrack-mcp OAuth server (incl. refresh-token
    # rotation) holds the most security-sensitive new code, but the
    # package's `npm test` script was never wired into CI. Adding this
    # job so `services/gymtrack-mcp/**` changes are validated against
    # the existing vitest suite on every PR. Mirrors the gymtrack-tests
    # job above; no Rollup native binary needed (vitest, not rollup).
    name: gymtrack-mcp tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run gymtrack-mcp tests
        run: npm test --workspace @sindustries/gymtrack-mcp

  design-system-sync:
    name: design system sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run design sync check
        run: npm run check:design-sync

      - name: Run design-tokens tests
        run: npm test --workspace @sindustries/design-tokens

      - name: Run ui package tests
        run: npm test --workspace @sindustries/ui

  no-absolute-paths-lint:
    name: no-absolute-paths lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run no-absolute-paths lint
        # W28 audit M0.2: Theme 4 guardrail. Fails CI if any tracked source
        # file under apps/, services/, packages/, or agents/workflows/
        # contains a hard-coded `/Users/<name>/`, `~/workspaces|repos|
        # code|dev|projects|src/`, or `/home/<name>/` path. Operates on the
        # checked-out working tree; no `npm ci` required.
        run: node scripts/check-no-absolute-paths.mjs

      - name: Run no-absolute-paths lint unit tests
        run: node --test scripts/test/check-no-absolute-paths.test.mjs

  infra-cloud-bootstrap-staging-tests:
    # Task 5baf6809 (Fix Fly staging deploy infra blockers). Three shell
    # tests that gate AC1 (bootstrap-staging.sh `fly apps create` arg shape
    # + substring-match rejection), AC2 (fly.toml `context` paths under
    # infra/cloud/fly), and AC3 (repo is npm-only — no pnpm pin in root
    # package.json, per Quinn [quinn-decision] 8d35d4e1 on 2026-08-27).
    # Tests stage a stub `flyctl` in PATH that records argv; no live Fly
    # auth or Docker daemon required, so this job runs in seconds.
    name: infra/cloud bootstrap + fly.toml + no-pnpm-pin tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap-staging.sh AC1 tests
        # Stub flyctl must precede the real one on PATH. The test sources
        # a flyctl stub from its own $TMP/bin, so we don't need anything
        # beyond bash + python3 here.
        run: bash infra/cloud/scripts/tests/bootstrap-staging.test.sh

      - name: Run fly.toml context path AC2 test
        run: bash infra/cloud/scripts/tests/fly-toml-context.test.sh

      - name: Run package.json no-pnpm-pin AC3 test
        run: bash infra/cloud/scripts/tests/package-json-no-pnpm-pin.test.sh

      - name: Run Mission Control Vercel deployment contract test
        run: bash infra/cloud/scripts/tests/mission-control-deploy-fixtures.test.sh

      - name: Run Fly deploy trigger paths test (task 2b66ae79, W38 T3)
        # AC1 + AC2 regression guard for the Fly deploy `paths:` filters —
        # closes the W38 audit finding where three staging workflows
        # referenced pnpm-lock.yaml (not present at the repo root) and
        # the MCP workflow referenced neither manifest nor lockfile.
        run: bash infra/cloud/scripts/tests/fly-deploy-trigger-paths.test.sh

      - name: Run CI and deployment gate contract test
        run: bash infra/cloud/scripts/tests/ci-deployment-gates.test.sh

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    # AC2 of task 206927ed: server-side guard for secrets reaching source
    # control. Companion to the local pre-commit hook installed by
    # scripts/install-hooks.sh. Uses the official gitleaks action with
    # the repo-local .gitleaks.toml allowlist (empty .env.example lines,
    # test fixtures).
    #
    # NOTE: gitleaks-action@v2 requires a `GITLEAKS_LICENSE` GitHub
    # Secret at the org level for organization repos. Until that secret
    # is provisioned by platform/Tom, this step is marked
    # `continue-on-error: true` so the scan still runs (and surfaces
    # findings via the PR comment) without blocking CI. The local
    # pre-commit hook from scripts/install-hooks.sh covers AC2 in
    # practice. Follow-up: remove `continue-on-error` once
    # GITLEAKS_LICENSE is set.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  feature-task-clippy:
    name: feature-task clippy (-D warnings)
    needs: changes
    if: needs.changes.outputs.feature_task == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agents/workflows/feature-task -> target

      - name: Run clippy (-D warnings)
        run: cargo clippy --manifest-path agents/workflows/feature-task/Cargo.toml --all-targets -- -D warnings

  frontend-design-system-lint:
    # Task da86ccd8 (Add @shadcn/lint to the frontend workspace) +
    # task 7986eb43 slice 4 (Adopt Tailwind v4 in @sindustries/ui —
    # activates @shadcn/lint rules).
    #
    # Active install — asserts the install + plugin registration +
    # at least one shadcn/* rule in the top-level rules block +
    # settings.shadcn key path (NOT settings.shadcn-lint — that was the
    # dormant-install key path; @shadcn/lint 0.1.0 reads settings.shadcn)
    # + oxlint --print-config clean. Then runs the actual lint pass on
    # packages/ui/src/react + the four frontend apps and exits non-zero
    # if any shadcn/* offence is found.
    #
    # See docs/systems/design-system.md 'Design-system linting' section
    # for the rule policy and the Accepted-baseline triage that follows
    # slice 4.
    name: frontend design-system lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (oxlint + @shadcn/lint)
        # oxlint needs the @shadcn/lint plugin to be resolvable from
        # node_modules. `npm ci` is required for the actual lint pass
        # to resolve the plugin and apply shadcn/* rules.
        run: npm ci --no-audit --no-fund

      - name: Run frontend design-system lint
        # Asserts the slice-4 contract (settings.shadcn + at least one
        # shadcn/* rule) and runs the active lint pass; exits non-zero
        # when shadcn/* offences exist.
        run: node scripts/check-design-system-lint.mjs

      - name: Run frontend design-system lint unit tests
        run: node --test scripts/test/check-design-system-lint.test.mjs

  merge-gate:
    name: merge gate
    if: always()
    needs:
      - changes
      - python-workflow-tests
      - cto-craft-tweet-drafts-tests
      - otel-node-tests
      - mission-control-tests
      - tasks-api-tests
      - content-scheduler-api-tests
      - feature-task-workflow-tests
      - ash-tests
      - budget-api-unit
      - budget-api-db-integration
      - tasks-app-tests
      - tasks-app-e2e
      - website-app-tests
      - gymtrack-tests
      - gymtrack-mcp-tests
      - design-system-sync
      - no-absolute-paths-lint
      - infra-cloud-bootstrap-staging-tests
      - gitleaks
      - feature-task-clippy
      - frontend-design-system-lint
    runs-on: ubuntu-latest
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require every applicable CI job
        run: python3 infra/cloud/scripts/check-ci-results.py

  deploy-website-staging:
    name: website staging
    needs: [changes, merge-gate]
    if: always() && needs.merge-gate.result == 'success' && needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website-deploy.yml
    with:
      target: staging
      production-candidate: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  deploy-website-production:
    name: website production
    needs: [changes, merge-gate, deploy-website-staging]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.website == 'true' &&
      needs.deploy-website-staging.result == 'success'
    uses: ./.github/workflows/website-deploy.yml
    with:
      target: production
      candidate-url: ${{ needs.deploy-website-staging.outputs.deployment_url }}
    secrets: inherit

  deploy-tasks-api-staging:
    name: tasks-api staging
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.tasks_api == 'true'
    uses: ./.github/workflows/deploy-staging-tasks-api.yml
    secrets: inherit

  deploy-budget-api-staging:
    name: budget-api staging
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.budget_api == 'true'
    uses: ./.github/workflows/deploy-staging-budget-api.yml
    secrets: inherit

  deploy-auto-post-worker-staging:
    name: auto-post-worker staging
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.auto_post_worker == 'true'
    uses: ./.github/workflows/deploy-staging-auto-post-worker.yml
    secrets: inherit

  deploy-gymtrack-production:
    name: gymtrack production
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.gymtrack == 'true'
    uses: ./.github/workflows/gymtrack-deploy.yml
    secrets: inherit

  deploy-gymtrack-mcp-production:
    name: gymtrack-mcp production
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.gymtrack_mcp == 'true'
    uses: ./.github/workflows/gymtrack-mcp-deploy.yml
    secrets: inherit

  eas-update-production:
    name: EAS update on main
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.budget_mobile == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eas-update-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish EAS update
        working-directory: apps/budget-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | tr '\n\r' '  ' | tr -s ' ' | cut -c1-180)"
          SHORT_SHA="${GITHUB_SHA::7}"
          npx eas update --branch main --message "ci: ${MESSAGE} (sha ${SHORT_SHA})" --non-interactive
