          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run no-absolute-paths lint
        # W28 audit M0.2: Theme 4 guardrail. Fails CI if any tracked source
        # file under the lint's configured roots contains a hard-coded
        # `/Users/<name>/`, `~/workspaces|repos|code|dev|projects|src/`, or
        # `/home/<name>/` path. The roots and the one opt-out are defined in
        # the script and documented in CONTRIBUTING.md, and the two are
        # asserted to agree by
        # infra/cloud/scripts/tests/no-absolute-paths-scope.test.sh, so the
        # scope is stated in one place instead of copied here.
        # Operates on the checked-out working tree; no `npm ci` required.
        run: node scripts/check-no-absolute-paths.mjs

      - name: Run no-absolute-paths lint unit tests
        run: node --test scripts/test/check-no-absolute-paths.test.mjs

