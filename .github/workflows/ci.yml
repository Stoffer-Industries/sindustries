name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eas-update-on-main:
    name: EAS update on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: eas-update-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish EAS update
        working-directory: apps/budget-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | tr '\n\r' '  ' | tr -s ' ' | cut -c1-180)"
          SHORT_SHA="${GITHUB_SHA::7}"
          npx eas update --branch main --message "ci: ${MESSAGE} (sha ${SHORT_SHA})" --non-interactive

  python-workflow-tests:
    name: python workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python workflow tests
        env:
          PYTHONPATH: agents/skills/tasks-api-ops
        run: python -m unittest discover -s tests -p 'test_*.py'

  otel-node-tests:
    name: otel-node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run otel-node tests
        run: npm test --workspace @sindustries/otel-node

  mission-control-tests:
    name: mission-control tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run mission-control tests
        run: npm test --workspace @sindustries/mission-control

  tasks-api-tests:
    name: tasks-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Check Prisma migration prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Run unit tests
        run: npm test --workspace services/tasks-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/tasks-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/tasks-api

      - name: Run DB integration tests
        run: npm run test:integration --workspace services/tasks-api

  feature-task-workflow-tests:
    name: feature-task workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run feature-task tests
        run: cargo test --manifest-path agents/workflows/feature-task/Cargo.toml

  budget-api-tests:
    name: budget-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Run unit tests
        run: npm test --workspace services/budget-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

  tasks-app-tests:
    name: tasks app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks

      - name: Run unit/component tests
        run: npm test --workspace apps/tasks

  tasks-app-e2e:
    name: tasks app e2e (ui + api + db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Apply DB migrations + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
        run: |
          npm run prisma:migrate --workspace services/tasks-api
          npm run prisma:seed --workspace services/tasks-api

      - name: Start tasks-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
          PORT: 4000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          ALLOW_PORT_DB_MISMATCH: "1"
          OTEL_SDK_DISABLED: "1"
        run: npm run start --workspace services/tasks-api > /tmp/tasks-api.log 2>&1 &

      - name: Wait for tasks-api
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4000/health && exit 0
            sleep 2
          done
          echo "tasks-api failed to start"
          cat /tmp/tasks-api.log
          exit 1

      - name: Install Playwright browser + system deps
        run: npm exec --workspace apps/tasks playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          CI: true
        run: npm run test:e2e --workspace apps/tasks

      - name: Dump tasks-api logs on failure
        if: failure()
        run: cat /tmp/tasks-api.log

  website-app-tests:
    name: website app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/website

      - name: Run unit tests
        run: npm test --workspace apps/website

      - name: Check content image links
        run: npm run check:content-links --workspace apps/website

      - name: Build website
        run: npm run build --workspace apps/website

  design-system-sync:
    name: design system sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run design sync check
        run: npm run check:design-sync

      - name: Run design-tokens tests
        run: npm test --workspace @sindustries/design-tokens

      - name: Run ui package tests
        run: npm test --workspace @sindustries/ui
