  infra-cloud-bootstrap-staging-tests:
    # Task 5baf6809 (Fix Fly staging deploy infra blockers). Three shell
    # tests that gate AC1 (bootstrap-staging.sh `fly apps create` arg shape
    # + substring-match rejection), AC2 (fly.toml `context` paths under
    # infra/cloud/fly), and AC3 (repo is npm-only — no pnpm pin in root
    # package.json, per Quinn [quinn-decision] 8d35d4e1 on 2026-08-27).
    # Tests stage a stub `flyctl` in PATH that records argv; no live Fly
    # auth or Docker daemon required, so this job runs in seconds.
    name: infra/cloud bootstrap + fly.toml + no-pnpm-pin tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bootstrap-staging.sh AC1 tests
        # Stub flyctl must precede the real one on PATH. The test sources
        # a flyctl stub from its own $TMP/bin, so we don't need anything
        # beyond bash + python3 here.
        run: bash infra/cloud/scripts/tests/bootstrap-staging.test.sh

      - name: Run retired staging apps guard test (task 219fb673)
        # The four per-service staging Fly apps were destroyed at the
        # staging cutover. No operator surface may still resolve to them:
        # the platform's auto-post worker and the retired worker app would
        # otherwise be two consumers on one BullMQ queue.
        run: bash infra/cloud/scripts/tests/retired-staging-apps.test.sh

      - name: Run fly.toml context path AC2 test
        run: bash infra/cloud/scripts/tests/fly-toml-context.test.sh

      - name: Run package.json no-pnpm-pin AC3 test
        run: bash infra/cloud/scripts/tests/package-json-no-pnpm-pin.test.sh

      - name: Run Mission Control Vercel deployment contract test
        run: bash infra/cloud/scripts/tests/mission-control-deploy-fixtures.test.sh

      - name: Run Fly deploy trigger paths test (task 2b66ae79, W38 T3)
        # AC1 + AC2 regression guard for the Fly deploy `paths:` filters —
        # closes the W38 audit finding where three staging workflows
        # referenced pnpm-lock.yaml (not present at the repo root) and
        # the MCP workflow referenced neither manifest nor lockfile.
        run: bash infra/cloud/scripts/tests/fly-deploy-trigger-paths.test.sh

      - name: Run CI and deployment gate contract test
        run: bash infra/cloud/scripts/tests/ci-deployment-gates.test.sh

      - name: Run local test-command documentation parity test
        # Keeps CONTRIBUTING.md's documented local test commands in step with
        # the Makefile's `test` / `test-all` targets, in both directions.
        # Closes the W44 code-garden follow-up where the documented command
        # block omitted `make test-website` while the prose claimed
        # `make test-all` ran the website tests.
        run: bash infra/cloud/scripts/tests/local-test-commands.test.sh

      - name: Run path-lint scope documentation parity test
        # Keeps CONTRIBUTING.md's documented path-lint scope in step with the
        # lint's own DEFAULT_ROOTS and SKIP_PATH_PREFIXES, in both directions.
        # Closes the W44 code-garden follow-up where the documented scope
        # named `agents/workflows/` without the
        # `agents/workflows/feature-task/src` opt-out, so a contributor
        # believed a directory was linted when it was not.
        run: bash infra/cloud/scripts/tests/no-absolute-paths-scope.test.sh

      - name: Run CI job contract-test inventory parity test
        # Keeps CONTRIBUTING.md's inventory of the contract tests this job runs
        # in step with the job's own run steps, in both directions. Closes the
        # W44 code-garden follow-up where the inventory named three of the
        # job's contract tests, so the rest were documented nowhere.
        run: bash infra/cloud/scripts/tests/ci-job-script-inventory.test.sh

      - name: Run Budget mobile OTA input paths test (task 74503fe7, W39 F3)
        # AC1 + AC2 regression guard for the `budget_mobile` change filter —
        # closes the W39 audit finding where the filter omitted
        # packages/ui/** and packages/design-tokens/** even though the
        # mobile dashboard imports both and the native UI export points
        # at source.
        run: bash infra/cloud/scripts/tests/budget-mobile-ota-inputs.test.sh

      # Task 219fb673 — the consolidated platform's supervisor owns the
      # real failure modes: a child that crashes on boot, a secret that was
      # never registered, a deploy that sends SIGTERM and expects a clean
      # drain. All three are covered against a fake child process — no real
      # service is started and no port is bound.
      #
      # The test FILE is named explicitly, not the directory: this job does
      # not set up a Node version, and the runner's default Node treats a
      # directory argument to `node --test` as a module path
      # ("Cannot find module .../infra/cloud/platform/tests"). Same
      # convention as the `node --test tests/cloud/tests/...` steps below.
      - name: Run consolidated platform supervisor unit tests
        run: node --test infra/cloud/platform/tests/platform-supervisor.test.mjs

      # Task 219fb673 — the platform's twelve app-level secrets are mapped
      # from the staging GitHub environment secrets, and a wrong mapping
      # would point a child at the wrong database or the wrong Redis
      # instance. The mapping is covered here against fake values; no
      # secret value appears in the fixtures.
      - name: Run consolidated platform provisioning unit tests
        run: node --test infra/cloud/platform/tests/platform-provision-secrets.test.mjs

      # Task 219fb673 — the provisioning CLI is what actually runs in CI,
      # so the CLI path is tested with a stubbed flyctl: the app-create
      # argv must be executable by the pinned flyctl 0.4.102 (which has no
      # `--region` flag on `apps create`), the secret write must be
      # DIRECT (not `--stage`, which never reached the Machine a deploy
      # created) and DETACHED (so a health-gated restart cannot abort the
      # deploy that repairs it), and no source or derived secret value may
      # reach stdout/stderr. The cutover ordering invariant and the deploy
      # gate are checked as static contracts over the runbook, the operator
      # deploy path and the deploy workflow.
      - name: Run consolidated platform provisioning CLI tests
        run: node --test infra/cloud/platform/tests/platform-provision-secrets-cli.test.mjs

      - name: Run platform cutover order and deploy gate tests
        run: node --test infra/cloud/platform/tests/platform-cutover-order.test.mjs

      # Task 219fb673 — the provisioning step must not be able to fail
      # because of the state of the image it is about to replace: the
      # secret write is detached, the workflow never writes secrets
      # directly, and the secrets are registered before the canary deploy
      # creates the Machine that boots with them.
      - name: Run platform provisioning order tests
        run: node --test infra/cloud/platform/tests/platform-provision-order.test.mjs

      # Task 219fb673 — the operator surfaces that show flyctl's output
      # (bin/status and the platform provisioner) share ONE credential
      # redactor, so a credential shape one surface did not know about
      # cannot print in the clear. This is the contract for that module:
      # every covered shape is asserted here, and the shell surface's own
      # regression cases live in infra/cloud/bin/tests/status.test.sh.
      - name: Run operator output redaction unit tests
        run: node --test infra/cloud/platform/tests/redact-output.test.mjs

  gh-with-agent-token-tests:
    # Task b0d1b42e (Fix Ambient GITHUB_TOKEN Overriding Per-Agent GH Config
    # Precedence). AC1 + AC2 regression guard for the agents/lib
    # gh-with-agent-token.sh shim. Stages a stub `gh` on PATH that records
    # argv and the relevant environment so the assertions can verify the
    # shim unscoped ambient GITHUB_TOKEN/GH_TOKEN, sets GH_CONFIG_DIR to the
    # per-agent config dir, and exports GH_TOKEN=$<AGENT>_GITHUB_TOKEN.
    # No live GitHub auth or network required; runs in seconds.
    name: agents/lib gh-with-agent-token shim tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gh-with-agent-token shim tests
        run: bash agents/lib/tests/test_gh_with_agent_token.sh

      # Task 2850c5ac (cloud-staging-environment) bin/ wrappers
      - name: Run bin/deploy contract test
        # Stubs flyctl, curl, and python3 via the test script's own $TMP/bin.
        # AC1 + AC2 regression guard for infra/cloud/bin/{deploy,status,rollback}.
        run: bash infra/cloud/bin/tests/deploy.test.sh

      - name: Run bin/status contract test
        run: bash infra/cloud/bin/tests/status.test.sh

      - name: Run bin/rollback contract test
        run: bash infra/cloud/bin/tests/rollback.test.sh

      - name: Run cloud staging workflow harness tests
        run: node --test tests/cloud/tests/staging-workflows.test.mjs

      # Task 219fb673: the staging-target preflight used to build ONE
      # allow-list from every staging hostname and apply it to all three
      # target variables, so a TASKS_API_URL pointing at the budget-api
      # hostname PASSED — every service exposes /health, so the harness
      # probed the wrong service and reported `tasks.health: pass`. The
      # checker resolves each target against its OWN surface's routes.
      # Run by explicit path so the repository-wide contract-test orphan
      # guard sees it as executed.
      - name: Run staging-target preflight contract test
        run: node --test tests/cloud/tests/check-staging-target-preflight.test.mjs

      # Task 219fb673: the hostname matrix is the source of truth for the
      # per-surface staging routes the preflight validates against, and it
      # must agree with the router that actually serves them. Run the
      # checker explicitly so a route recorded in the matrix but missing
      # from nginx.conf (or vice versa) fails on the PR that introduces it.
      - name: Run stable-hostname matrix shape check
        run: node tests/cloud/scripts/check-stable-hostname-matrix.mjs

      - name: Run cloud staging failure-drill contract tests
        run: bash tests/cloud/tests/staging-failure-drill.test.sh

      # Task 37622d4f AC4 static check: the website deploy workflow must
      # resolve one Vercel target and use it for pull, build, and deploy,
      # so the prebuilt output's target and the deploy target cannot drift.
      # Run by explicit path so the repository-wide contract-test orphan
      # guard sees it as executed.
      - name: Run Vercel deploy target contract test
        run: node --test tests/cloud/tests/check-vercel-deploy-target.test.mjs

      # Task 1ac03ee8 AC3 static check: the website production promotion must
      # resolve the candidate deployment in the Vercel team scope that created
      # it, from one explicit source in the workflow, not from the token's
      # default scope. Run by explicit path so the repository-wide
      # contract-test orphan guard sees it as executed.
      - name: Run Vercel production promotion scope contract test
        run: node --test tests/cloud/tests/check-vercel-production-promotion-scope.test.mjs

      # Task 83edc146: a `run:` block is not parsed by the workflow engine,
      # so a shell syntax error inside one stays invisible until the job
      # runs it — and then it fails during a production deploy, after the
      # machine has already been updated. The gymtrack-mcp production job
      # failed exactly this way: a `stable-fallback` annotation comment
      # placed inside a backslash-continued pipeline swallowed the `| grep`
      # that followed it, and the step died with a syntax error while the
      # deployment it was checking was healthy.
      #
      # The checker parses every run block in every workflow and asks bash to
      # parse it too, so the failure lands on the PR that introduced it.
      - name: Check every workflow run block parses as bash
        run: node tests/cloud/scripts/check-workflow-shell-syntax.mjs .

      # Run by explicit path so the repository-wide contract-test orphan
      # guard sees it as executed.
      - name: Run workflow shell-syntax contract test
        run: node --test tests/cloud/tests/check-workflow-shell-syntax.test.mjs

      # Task 5cb4a8fe AC5 static check: dry-run the stable-hostname
      # verification harness so every CI run proves the harness emits
      # schema-valid JSON for the committed matrix, even when DNS is
      # not live. The dry-run mode never opens a socket, so this is
      # safe to run on every PR without staging credentials.
      - name: Run stable-hostname verification harness tests
        run: node --test tests/cloud/tests/stable-hostname-verification.test.mjs

      # Task 5cb4a8fe AC5 static check: invoke the harness in dry-run
      # mode and validate the emitted JSON against the committed
      # schema. This is the merge-gate guarantee that the harness +
      # schema + matrix are in lockstep on every commit.
      - name: Static-check stable-hostname verification harness (dry-run)
        run: |
          set -euo pipefail
          out="$(mktemp -t stable-hostname-verification.XXXXXX.json)"
          node tests/cloud/scripts/stable-hostname-verification.mjs \
            --mode dry-run --run-id "ci-${GITHUB_SHA::12}" --output "${out}"
          node tests/cloud/scripts/check-schema.mjs "${out}" \
            tests/cloud/stable-hostname-verification.schema.json
          echo "stable-hostname-verification dry-run: schema-valid JSON, ${GITHUB_SHA::12}"

  offline-contract-tests:
    # Task d63b1491 (W46 audit F4): five contract tests existed on disk but no
    # CI job executed them, so they asserted nothing in the merge gate.
    #
    #   - the PR opener identity guard (agents/skills/dev/pr-open)
    #   - the four cloud-database helper / constraint checks
    #
    # All five are offline by construction: no production credentials, no live
    # database, no network egress. The opener-identity test stages a stub `gh`
    # on PATH, and the schema-presence test stages stub psql/pg_restore
    # binaries, so the job needs no service at all — only bash, python3 (the
    # cleanup script shells out to it) and `shasum` (the sha256sum stub's
    # delegate), both declared below rather than assumed from the image.
    #
    # The job is wired into `merge-gate.needs` below, so a failure in any of
    # the five blocks the merge. The live-database drill that shares the
    # `test:cloud-db` npm script
    # (tests/cloud/tests/staging-db-migration-failure-drill.test.sh) is
    # deliberately NOT run here: it needs a real database, so it stays with
    # the root `test:cloud-db` script and the cloud-staging-db-drill
    # workflow. It is documented as such in CONTRIBUTING.md.
    name: offline contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure the sha256 helper is available
        # `schema-presence.test.sh` stages a `sha256sum` stub that delegates to
        # `shasum -a 256` (the macOS spelling). `shasum` ships with perl, which
        # is present on the runner image but is not a base-package guarantee,
        # so it is installed explicitly rather than assumed. The step is a
        # no-op when the runner already provides it.
        run: |
          if ! command -v shasum >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends perl
          fi

      - name: Run PR opener identity contract test
        run: bash agents/skills/dev/pr-open/tests/test_assert_opener_identity.sh

      - name: Run cloud database shared-helper contract test
        run: bash scripts/cloud/database/tests/common.test.sh

      - name: Run cloud database manifest-constraints contract test
        run: bash scripts/cloud/database/tests/manifest-constraints.test.sh

      - name: Run cloud database restore-result-directory contract test
        run: bash scripts/cloud/database/tests/restore-result-dir.test.sh

      - name: Run cloud database schema-presence contract test
        run: bash scripts/cloud/database/tests/schema-presence.test.sh

  gog-cli-tests:
    # PR #886 (fix(agents-lib): bypass ambient proxy for the gog CLI).
    # AC1 + AC2 regression guard for the agents/lib gog-cli.sh wrapper and
    # the gog-with-direct-egress.sh shim. Stages a stub `gog` on PATH that
    # records argv and the environment it received, so the assertions can
    # verify the wrapper strips HTTP_PROXY/HTTPS_PROXY/http_proxy/
    # https_proxy/ALL_PROXY/all_proxy, that argv and unrelated env survive
    # the wrapper, that the sourceable shim behaves identically under bash and
    # zsh (the ~/.zshenv production path), and that the missing-wrapper
    # fallback branch is genuinely exercised rather than silently resolving
    # the real wrapper.
    # No live Google auth or network required; runs in seconds.
    name: agents/lib gog-cli shim tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gog-cli shim tests
        run: bash agents/lib/tests/test_gog_cli.sh

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    # Server-side guard for secrets reaching source control (AC2 of task
    # 206927ed), and the enforcement fix of task 2b3962b1.
    #
    # This job runs the gitleaks CLI directly. It does NOT use
    # gitleaks/gitleaks-action, which refuses to start on an organisation
    # repo without a paid `GITLEAKS_LICENSE` secret: the action aborted
    # before scanning anything, and `continue-on-error: true` turned that
    # abort into a green `success`. This job is a required `merge-gate`
    # input, so the merge gate had been collecting a green secret-scan
    # result from a job that had never scanned a commit (W42 F6, W43 F2,
    # W44, W46 F3).
    #
    # The CLI is MIT-licensed and needs no credential, so the gate is
    # enforceable today with no owner-only provisioning step. The binary is
    # pinned by version and SHA256 in
    # infra/cloud/scripts/install-gitleaks.sh, which every surface that
    # needs the binary calls, so a tampered or truncated download fails
    # this job instead of failing open.
    #
    # Scope is the change AND the tracked tree:
    #   - the change: `base.sha..HEAD` for pull requests, `before..sha`
    #     for pushes to main
    #   - the tree: every tracked file at HEAD, exported from the Git
    #     index, so a secret committed into any tracked file fails this
    #     job even when the commit carrying it is outside the change
    #     range
    #
    # The tree scan joins the gate only because the tracked tree at main
    # scans clean under the enforced config (task 46211c26). Without that
    # clean baseline, wiring it in would redden every open pull request
    # on an unrelated historic finding, and the tempting fix -- a broad
    # allowlist entry -- is exactly what that task exists to prevent.
    #
    # The full published history is NOT scanned here. It runs on a weekly
    # schedule in .github/workflows/secret-scan-history.yml, which is an
    # alerting surface and not a merge-gate input: a full-history scan on
    # every run is too slow, and a history-only finding must not block a
    # merge that does not contain it.
    #
    # Every failure mode blocks this job, and therefore the merge gate:
    # secrets found, a missing binary, a missing config, and a scan scope
    # that resolves to zero commits or zero tracked files -- a green check
    # must never mean "scanned nothing".
    #
    # Companion to the local pre-commit hook installed by
    # scripts/install-hooks.sh; both go through the same entrypoint,
    # infra/cloud/scripts/run-secret-scan.sh, so the policy cannot drift.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the pinned gitleaks release
        id: pin
        run: bash infra/cloud/scripts/install-gitleaks.sh --print-pin

      - name: Cache the pinned gitleaks archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/sindustries-gitleaks
          key: gitleaks-cli-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}

      - name: Install gitleaks CLI (pinned)
        run: bash infra/cloud/scripts/install-gitleaks.sh

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash infra/cloud/scripts/run-secret-scan.sh --base "$BASE_SHA"

      - name: Scan the tracked tree for secrets
        run: bash infra/cloud/scripts/run-secret-scan.sh --tree

      - name: Contract test for secret-scan enforcement
        run: bash infra/cloud/scripts/tests/secret-scan-enforcement.test.sh

  feature-task-clippy:
    name: feature-task clippy (-D warnings)
    needs: changes
    if: needs.changes.outputs.feature_task == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agents/workflows/feature-task -> target

      - name: Run clippy (-D warnings)
        run: cargo clippy --manifest-path agents/workflows/feature-task/Cargo.toml --all-targets -- -D warnings

  frontend-design-system-lint:
    # Task da86ccd8 (Add @shadcn/lint to the frontend workspace) +
    # task 7986eb43 slice 4 (Adopt Tailwind v4 in @sindustries/ui —
    # activates @shadcn/lint rules).
    #
    # Active install — asserts the install + plugin registration +
    # at least one shadcn/* rule in the top-level rules block +
    # settings.shadcn key path (NOT settings.shadcn-lint — that was the
    # dormant-install key path; @shadcn/lint 0.1.0 reads settings.shadcn)
    # + oxlint --print-config clean. Then runs the actual lint pass on
    # packages/ui/src/react + the four frontend apps and exits non-zero
    # if any shadcn/* offence is found.
    #
    # See docs/systems/design-system.md 'Design-system linting' section
    # for the rule policy and the Accepted-baseline triage that follows
    # slice 4.
    name: frontend design-system lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (oxlint + @shadcn/lint)
        # oxlint needs the @shadcn/lint plugin to be resolvable from
        # node_modules. `npm ci` is required for the actual lint pass
        # to resolve the plugin and apply shadcn/* rules.
        run: npm ci --no-audit --no-fund

      - name: Run frontend design-system lint
        # Asserts the slice-4 contract (settings.shadcn + at least one
        # shadcn/* rule) and runs the active lint pass; exits non-zero
        # when shadcn/* offences exist.
        run: node scripts/check-design-system-lint.mjs

      - name: Run frontend design-system lint unit tests
        run: node --test scripts/test/check-design-system-lint.test.mjs

  merge-gate:
    name: merge gate
    if: always()
    needs:
      - changes
      - python-workflow-tests
      - cto-craft-tweet-drafts-tests
      - otel-node-tests
      - health-probe-tests
      - mission-control-tests
      - tasks-api-tests
      - content-scheduler-api-tests
      - content-scheduler-api-db-integration
      - feature-task-workflow-tests
      - ash-tests
      - budget-api-unit
      - budget-api-db-integration
      - tasks-app-tests
      - tasks-app-e2e
      - website-app-tests
      - gymtrack-tests
      - gymtrack-mcp-tests
      - design-system-sync
      - no-absolute-paths-lint
      - typecheck-gate-tests
      - infra-cloud-bootstrap-staging-tests
      - gitleaks
      - feature-task-clippy
      - frontend-design-system-lint
      - gh-with-agent-token-tests
      - offline-contract-tests
      - gog-cli-tests
    runs-on: ubuntu-latest
    env:
      REQUIRED_RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require every applicable CI job
        run: python3 infra/cloud/scripts/check-ci-results.py

  deploy-website-staging:
    name: website staging
    needs: [changes, merge-gate]
    if: always() && needs.merge-gate.result == 'success' && needs.changes.outputs.website == 'true'
    uses: ./.github/workflows/website-deploy.yml
    with:
      target: staging
      production-candidate: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets: inherit

  deploy-website-production:
    name: website production
    needs: [changes, merge-gate, deploy-website-staging]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.website == 'true' &&
      needs.deploy-website-staging.result == 'success'
    uses: ./.github/workflows/website-deploy.yml
    with:
      target: production
      candidate-url: ${{ needs.deploy-website-staging.outputs.deployment_url }}
    secrets: inherit

  # Task 219fb673 — deploy-tasks-api-staging, deploy-budget-api-staging,
  # deploy-content-scheduler-api-staging and deploy-auto-post-worker-staging
  # jobs removed 2026-11-07: the four underlying Fly apps were destroyed at
  # Tom's explicit instruction, ahead of the cutover landing. `platform`
  # below is now the only deploy surface for these four services.

  deploy-platform-staging:
    name: platform staging
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.platform == 'true'
    uses: ./.github/workflows/deploy-staging-platform.yml
    secrets: inherit

  deploy-gymtrack-production:
    name: gymtrack production
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.gymtrack == 'true'
    uses: ./.github/workflows/gymtrack-deploy.yml
    secrets: inherit

  deploy-health-probe-staging:
    name: health-probe staging
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.health_probe == 'true'
    uses: ./.github/workflows/deploy-staging-health-probe.yml
    secrets: inherit

  deploy-gymtrack-mcp-production:
    name: gymtrack-mcp production
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.gymtrack_mcp == 'true'
    uses: ./.github/workflows/gymtrack-mcp-deploy.yml
    secrets: inherit

  eas-update-production:
    name: EAS update on main
    needs: [changes, merge-gate]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.merge-gate.result == 'success' &&
      needs.changes.outputs.budget_mobile == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: eas-update-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish EAS update
        working-directory: apps/budget-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | tr '\n\r' '  ' | tr -s ' ' | cut -c1-180)"
          SHORT_SHA="${GITHUB_SHA::7}"
          npx eas update --branch main --message "ci: ${MESSAGE} (sha ${SHORT_SHA})" --non-interactive
