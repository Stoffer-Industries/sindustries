name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eas-update-on-main:
    name: EAS update on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: eas-update-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Publish EAS update
        working-directory: apps/budget-mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE="$(printf '%s' "$COMMIT_MESSAGE" | tr '\n\r' '  ' | tr -s ' ' | cut -c1-180)"
          SHORT_SHA="${GITHUB_SHA::7}"
          npx eas update --branch main --message "ci: ${MESSAGE} (sha ${SHORT_SHA})" --non-interactive

  python-workflow-tests:
    name: python workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python workflow tests
        env:
          PYTHONPATH: >-
            agents/skills/tasks-api-ops:agents/workflows/bookmarks/scripts:agents/lib
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/scripts/tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/tests -p 'test_*.py'
          python -m unittest discover -s agents/lib -p 'test_*.py'
          python -m unittest discover -s agents/workflows/content-tasks/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/scripts -p 'test_*.py'

  cto-craft-tweet-drafts-tests:
    # W34 audit QW1: the cto-craft-tweet-drafts LangGraph pipeline holds
    # the most safety-relevant new code in this workflow (SSRF-safe fetcher,
    # advisory-lock durability, graph wiring). The package's pytest suite
    # (`test_safe_fetch.py`, `test_durability.py`, `test_graph.py`, plus
    # extraction/angle-model/issue-source tests) was never wired into CI,
    # which is why the SSRF rebinding gap and the ingest-secret auth
    # collision landed silently. Adding this job so PRs touching
    # `agents/workflows/cto-craft-tweet-drafts/**` are validated against
    # the existing pytest+respx+pytest-asyncio suite.
    #
    # Mirrors the W33 gymtrack-mcp-tests pattern (parallel dedicated job)
    # rather than folding into `python-workflow-tests` because:
    #   1. This suite is pytest-based with fixture-parametrized tests,
    #      `respx`, and `pytest-asyncio`; adding it to the existing
    #      `python -m unittest discover` step would error mid-discover.
    #   2. The workflow pins `requires-python = ">=3.11,<3.13"`; 3.12
    #      satisfies that range.
    #   3. Deps are pinned in `uv.lock`, so `uv sync --frozen --extra dev`
    #      installs reproducibly from the lockfile (no network lock step).
    #
    # W35 audit follow-up (task 60971f78): the cto-craft-tweet-drafts
    # production cron now uses a real `langgraph.checkpoint.postgres.
    # PostgresSaver` against `CTO_CRAFT_LANGGRAPH_DATABASE_URL`. A
    # regression test that exercises the actual Postgres checkpoint
    # path (rather than the in-memory stub used elsewhere in the suite)
    # is in `tests/test_postgres_saver_send_serialization.py`; it
    # `pytest.skip`s locally when the env var is unset and only runs in
    # CI under this job's `services.postgres`. Without this services
    # block the new test would always skip and the Send-serialization
    # regression that motivated task 60971f78 would land silently again.
    name: cto-craft-tweet-drafts tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cto_craft_langgraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cto_craft_langgraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CTO_CRAFT_LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cto_craft_langgraph
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install workflow dependencies
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv sync --frozen --extra dev

      - name: Run pytest
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv run --frozen --extra dev pytest

  otel-node-tests:
    name: otel-node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run otel-node tests
        run: npm test --workspace @sindustries/otel-node

  mission-control-tests:
    name: mission-control tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run mission-control tests
        run: npm test --workspace @sindustries/mission-control

  tasks-api-tests:
    name: tasks-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Check Prisma migration prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Run unit tests
        run: npm test --workspace services/tasks-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/tasks-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/tasks-api

      - name: Run DB integration tests
        run: npm run test:integration --workspace services/tasks-api

  feature-task-workflow-tests:
    name: feature-task workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run feature-task tests
        run: cargo test --manifest-path agents/workflows/feature-task/Cargo.toml

  ash-tests:
    name: ash verifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/ash/package-lock.json

      - name: Install agents/ash dependencies
        run: npm ci --prefix agents/ash

      - name: Run ash verifier tests
        run: npm test --prefix agents/ash

  budget-api-tests:
    name: budget-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Run unit tests
        run: npm test --workspace services/budget-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

  tasks-app-tests:
    name: tasks app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks

      - name: Run unit/component tests
        run: npm test --workspace apps/tasks

  tasks-app-e2e:
    name: tasks app e2e (ui + api + db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Apply DB migrations + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
        run: |
          npm run prisma:migrate --workspace services/tasks-api
          npm run prisma:seed --workspace services/tasks-api

      - name: Start tasks-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
          PORT: 4000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          ALLOW_PORT_DB_MISMATCH: "1"
          OTEL_SDK_DISABLED: "1"
        run: npm run start --workspace services/tasks-api > /tmp/tasks-api.log 2>&1 &

      - name: Wait for tasks-api
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4000/health && exit 0
            sleep 2
          done
          echo "tasks-api failed to start"
          cat /tmp/tasks-api.log
          exit 1

      - name: Install Playwright browser + system deps
        run: npm exec --workspace apps/tasks playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          CI: true
        run: npm run test:e2e --workspace apps/tasks

      - name: Dump tasks-api logs on failure
        if: failure()
        run: cat /tmp/tasks-api.log

  website-app-tests:
    name: website app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/website

      - name: Run unit tests
        run: npm test --workspace apps/website

      - name: Check content image links
        run: npm run check:content-links --workspace apps/website

      - name: Build website
        run: npm run build --workspace apps/website

  gymtrack-tests:
    name: gymtrack tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/gymtrack

      - name: Run unit/component tests
        run: npm test --workspace apps/gymtrack

  gymtrack-mcp-tests:
    # W33 audit QW1: the gymtrack-mcp OAuth server (incl. refresh-token
    # rotation) holds the most security-sensitive new code, but the
    # package's `npm test` script was never wired into CI. Adding this
    # job so `services/gymtrack-mcp/**` changes are validated against
    # the existing vitest suite on every PR. Mirrors the gymtrack-tests
    # job above; no Rollup native binary needed (vitest, not rollup).
    name: gymtrack-mcp tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run gymtrack-mcp tests
        run: npm test --workspace @sindustries/gymtrack-mcp

  design-system-sync:
    name: design system sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run design sync check
        run: npm run check:design-sync

      - name: Run design-tokens tests
        run: npm test --workspace @sindustries/design-tokens

      - name: Run ui package tests
        run: npm test --workspace @sindustries/ui

  no-absolute-paths-lint:
    name: no-absolute-paths lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run no-absolute-paths lint
        # W28 audit M0.2: Theme 4 guardrail. Fails CI if any tracked source
        # file under apps/, services/, packages/, or agents/workflows/
        # contains a hard-coded `/Users/<name>/`, `~/workspaces|repos|
        # code|dev|projects|src/`, or `/home/<name>/` path. Operates on the
        # checked-out working tree; no `npm ci` required.
        run: node scripts/check-no-absolute-paths.mjs

      - name: Run no-absolute-paths lint unit tests
        run: node --test scripts/test/check-no-absolute-paths.test.mjs

  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    # AC2 of task 206927ed: server-side guard for secrets reaching source
    # control. Companion to the local pre-commit hook installed by
    # scripts/install-hooks.sh. Uses the official gitleaks action with
    # the repo-local .gitleaks.toml allowlist (empty .env.example lines,
    # test fixtures).
    #
    # NOTE: gitleaks-action@v2 requires a `GITLEAKS_LICENSE` GitHub
    # Secret at the org level for organization repos. Until that secret
    # is provisioned by platform/Tom, this step is marked
    # `continue-on-error: true` so the scan still runs (and surfaces
    # findings via the PR comment) without blocking CI. The local
    # pre-commit hook from scripts/install-hooks.sh covers AC2 in
    # practice. Follow-up: remove `continue-on-error` once
    # GITLEAKS_LICENSE is set.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
