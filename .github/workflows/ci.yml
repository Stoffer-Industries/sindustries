name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      website: ${{ steps.filter.outputs.website }}
      platform: ${{ steps.filter.outputs.platform }}
      gymtrack: ${{ steps.filter.outputs.gymtrack }}
      gymtrack_mcp: ${{ steps.filter.outputs.gymtrack_mcp }}
      budget_mobile: ${{ steps.filter.outputs.budget_mobile }}
      feature_task: ${{ steps.filter.outputs.feature_task }}
      health_probe: ${{ steps.filter.outputs.health_probe }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed deployable surfaces
        id: filter
        uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        with:
          filters: |
            website:
              - 'apps/website/**'
              - 'packages/design-tokens/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vercel.json'
              - '.github/workflows/website-deploy.yml'
            # Task 219fb673 — the four per-app Fly apps
            # (sindustries-tasks-api-staging, -budget-api-staging,
            # -auto-post-worker-staging, -content-scheduler-api-staging)
            # were destroyed on 2026-11-07 at Tom's explicit instruction
            # ("I don't wanna pay for them anymore ever") ahead of the
            # cutover landing. Their deploy filters/jobs are removed here
            # so a future infra/cloud/** push (e.g. PR #929) doesn't try to
            # `flyctl deploy` onto apps that no longer exist and fail the
            # merge gate for everyone. `platform` is now the only surface
            # for these four services; see
            # docs/runbooks/platform-consolidation-rollback.md §5.
            platform:
              - 'services/tasks-api/**'
              - 'services/budget-api/**'
              - 'services/content-scheduler-api/**'
              - 'packages/otel-node/**'
              - 'packages/budget-domain/**'
              - 'package.json'
              - 'package-lock.json'
              - 'infra/cloud/**'
              - '.github/workflows/deploy-staging-platform.yml'
            gymtrack:
              - 'apps/gymtrack/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/gymtrack-deploy.yml'
            gymtrack_mcp:
              - 'services/gymtrack-mcp/**'
              - 'apps/gymtrack/server/agentData.js'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/gymtrack-mcp-deploy.yml'
            budget_mobile:
              - 'apps/budget-mobile/**'
              - 'packages/budget-domain/**'
              - 'packages/ui/**'
              - 'packages/design-tokens/**'
              - 'package.json'
              - 'package-lock.json'
            feature_task:
              - 'agents/workflows/feature-task/**'
            health_probe:
              - 'infra/cloud/observability/**'
              - 'packages/otel-node/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy-staging-health-probe.yml'

  python-workflow-tests:
    name: python workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python workflow tests
        env:
          PYTHONPATH: >-
            agents/skills/tasks-api-ops:agents/workflows/bookmarks/scripts:agents/lib
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/scripts/tests -p 'test_*.py'
          python -m unittest discover -s agents/workflows/bookmarks/tests -p 'test_*.py'
          python -m unittest discover -s agents/lib -p 'test_*.py'
          python -m unittest discover -s agents/workflows/content-tasks/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-api/scripts -p 'test_*.py'
          python -m unittest discover -s agents/skills/ops/tasks-analytics/tests -p 'test_*.py'
          python -m unittest discover -s agents/skills/growth/prospect-finder/tests -p 'test_*.py'

  cto-craft-tweet-drafts-tests:
    # W34 audit QW1: the cto-craft-tweet-drafts LangGraph pipeline holds
    # the most safety-relevant new code in this workflow (SSRF-safe fetcher,
    # advisory-lock durability, graph wiring). The package's pytest suite
    # (`test_safe_fetch.py`, `test_durability.py`, `test_graph.py`, plus
    # extraction/angle-model/issue-source tests) was never wired into CI,
    # which is why the SSRF rebinding gap and the ingest-secret auth
    # collision landed silently. Adding this job so PRs touching
    # `agents/workflows/cto-craft-tweet-drafts/**` are validated against
    # the existing pytest+respx+pytest-asyncio suite.
    #
    # Mirrors the W33 gymtrack-mcp-tests pattern (parallel dedicated job)
    # rather than folding into `python-workflow-tests` because:
    #   1. This suite is pytest-based with fixture-parametrized tests,
    #      `respx`, and `pytest-asyncio`; adding it to the existing
    #      `python -m unittest discover` step would error mid-discover.
    #   2. The workflow pins `requires-python = ">=3.11,<3.13"`; 3.12
    #      satisfies that range.
    #   3. Deps are pinned in `uv.lock`, so `uv sync --frozen --extra dev`
    #      installs reproducibly from the lockfile (no network lock step).
    #
    # W35 audit follow-up (task 60971f78): the cto-craft-tweet-drafts
    # production cron now uses a real `langgraph.checkpoint.postgres.
    # PostgresSaver` against `CTO_CRAFT_LANGGRAPH_DATABASE_URL`. A
    # regression test that exercises the actual Postgres checkpoint
    # path (rather than the in-memory stub used elsewhere in the suite)
    # is in `tests/test_postgres_saver_send_serialization.py`; it
    # `pytest.skip`s locally when the env var is unset and only runs in
    # CI under this job's `services.postgres`. Without this services
    # block the new test would always skip and the Send-serialization
    # regression that motivated task 60971f78 would land silently again.
    name: cto-craft-tweet-drafts tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cto_craft_langgraph
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cto_craft_langgraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CTO_CRAFT_LANGGRAPH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cto_craft_langgraph
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install workflow dependencies
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv sync --frozen --extra dev

      - name: Run pytest
        working-directory: agents/workflows/cto-craft-tweet-drafts
        run: uv run --frozen --extra dev pytest

  otel-node-tests:
    name: otel-node unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run otel-node tests
        run: npm test --workspace @sindustries/otel-node

  health-probe-tests:
    name: health-probe unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run health-probe tests
        run: npm test --workspace infra/cloud/observability/health-probe

      - name: Run observability provisioning contract test
        run: bash infra/cloud/scripts/tests/observability-provisioning.test.sh

      - name: Run observability bootstrap / evidence / failure-inject contract test (task 31233a0a)
        # AC2/AC3 evidence-pack helper regression guard — exercises the
        # subcommand dispatch + --dry-run surfaces of bootstrap-observability.sh,
        # evidence-capture.sh, and failure-inject.sh without requiring Fly or
        # Grafana access. Closes the gap where the operator scripts Quinn
        # runs could silently regress while the dashboard/alert JSONs stayed
        # in sync.
        run: bash infra/cloud/scripts/tests/observability-bootstrap.test.sh

      - name: Run observability drill-docs contract test (task 219fb673)
        # The service-scoped failure drills REFUSE (staging is one app), so
        # the operator docs must not hand the on-call engineer a command
        # that exits 1. This derives the refused set from the script itself
        # and fails if a doc prescribes one without saying it refuses.
        run: bash infra/cloud/scripts/tests/observability-drill-docs.test.sh

  mission-control-tests:
    name: mission-control tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Run mission-control tests
        run: npm test --workspace @sindustries/mission-control

  tasks-api-tests:
    name: tasks-api tests (unit + db integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
      OTEL_SDK_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Typecheck gate (tasks-api)
        # Task 876114be: ratcheting compiler gate — tsc output is compared
        # against services/tasks-api/typecheck-baseline.json; the gate
        # fails on growth (R1) or a new/grown diagnostic fingerprint (R2).
        # See docs/specs/backend-typecheck-gate-tech-design.md Decision 3.
        run: npm run typecheck:gate --workspace services/tasks-api

      - name: Check Prisma migration prefixes
        run: ./scripts/check-migration-prefixes.sh

      - name: Run unit tests
        run: npm test --workspace services/tasks-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/tasks-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/tasks-api

      - name: Run DB integration tests
        run: npm run test:integration --workspace services/tasks-api

  content-scheduler-api-tests:
    # W35 audit QW1: the content-scheduler-api service owns the
    # `content_scheduler` Postgres schema plus the in-process + BullMQ
    # auto-post adapters. The package's `npm test` script (vitest, six
    # files) was never wired into CI, which is why several extraction
    # readiness gaps landed silently. Adding this job so
    # `services/content-scheduler-api/**` changes are validated against
    # the existing vitest suite on every PR. Mirrors the
    # tasks-api-tests / budget-api-tests pattern: postgres service
    # container, DATABASE_URL pinned to `?schema=content_scheduler`,
    # `prisma:migrate deploy` to materialise the schema before the
    # supertest-instantiated app boots. Prisma is still mocked per-test
    # via `vi.mock('../src/lib/prisma.ts')`, so no DB integration step
    # is required — the schema just needs to exist so the Prisma
    # client can construct at module load.
    name: content-scheduler-api tests (vitest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_content_scheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_content_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_content_scheduler?schema=content_scheduler
      OTEL_SDK_DISABLED: '1'
      X_CLIENT: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/content-scheduler-api

      - name: Typecheck gate (content-scheduler-api)
        run: npm run typecheck:gate --workspace services/content-scheduler-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/content-scheduler-api

      - name: Run vitest suite
        run: npm test --workspace services/content-scheduler-api

  content-scheduler-api-db-integration:
    # W42 audit F2: the mocked `contentSchedulerThreadPublish.test.ts`
    # suite blanket-mocks Prisma, so real DB-layer bugs (a broken
    # transaction boundary, missing rollback, lost concurrent-claim
    # winner) silently pass CI. This job runs the parallel
    # `threadPublishAtomicClaimIntegration.test.ts` against the same
    # Postgres service the unit job provisions, proving the
    # interactive transaction actually rolls back on attempt-insert
    # failure and serialises concurrent claims to exactly one winner.
    # The test self-skips when `CONTENT_SCHEDULER_API_INTEGRATION_TEST`
    # is unset so local developers running `npm test` without a
    # Postgres instance are not broken. The unit job deliberately does
    # not set this env var.
    name: content-scheduler-api db integration (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_content_scheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_content_scheduler"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_content_scheduler?schema=content_scheduler
      CONTENT_SCHEDULER_API_INTEGRATION_TEST: '1'
      OTEL_SDK_DISABLED: '1'
      X_CLIENT: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/content-scheduler-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/content-scheduler-api

      - name: Run vitest suite (integration only)
        run: npm test --workspace services/content-scheduler-api -- threadPublishAtomicClaimIntegration

  feature-task-workflow-tests:
    name: feature-task workflow tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Run feature-task tests
        run: cargo test --manifest-path agents/workflows/feature-task/Cargo.toml

      # The model-eval harness grades model output with the production
      # parser, so it needs that binary built. `cargo test` above leaves the
      # debug binary in place; build it explicitly so the lobster grader
      # does not have to shell out to cargo on every case.
      - name: Build feature-task binary for the model-eval graders
        run: cargo build --manifest-path agents/workflows/feature-task/Cargo.toml

      # Model-free eval guard: every case's grader must separate its
      # known-good control from its known-bad one. A grader that cannot tell
      # them apart would report every model as excellent, or every model as
      # useless, and would look like a working eval suite from the outside.
      - name: Run model-eval harness self-tests
        env:
          PYTHONPATH: agents/evals:agents/lib
        run: python3 -m unittest discover -s agents/evals/tests -p 'test_*.py'

      - name: Validate model-eval graders against their controls
        env:
          PYTHONPATH: agents/evals:agents/lib
        run: python3 agents/evals/run.py --validate-only

  ash-tests:
    name: ash verifier tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agents/ash/package-lock.json

      - name: Install agents/ash dependencies
        run: npm ci --prefix agents/ash

      - name: Run ash verifier tests
        run: npm test --prefix agents/ash

  budget-api-unit:
    # W38 audit T0/F4 — renamed from `budget-api-tests` and split off the
    # misleading "(unit + db integration)" label. The job now honestly
    # declares its scope: budget-api unit tests + the budget-domain and
    # budget-mobile checks the workspace already declared but CI never
    # ran. The real-DB integration suite lives in the sibling
    # `budget-api-db-integration` job below. See docs/repo-audits/2026-W38.md
    # finding F4 for the audit trail.
    name: budget-api unit + domain/mobile checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Typecheck gate (budget-api)
        run: npm run typecheck:gate --workspace services/budget-api

      - name: Run unit tests
        run: npm test --workspace services/budget-api

      # W38 audit F4 AC1: CI now runs the budget-domain and budget-mobile
      # checks the rest of the workspace already declared. These three steps
      # are what the old "unit + db integration" job claimed to cover but
      # never actually exercised.
      - name: Run packages/budget-domain tests
        run: npm test --workspace packages/budget-domain

      - name: Run packages/budget-domain typecheck
        run: npm run typecheck --workspace packages/budget-domain

      - name: Run apps/budget-mobile typecheck
        run: npm run typecheck --workspace apps/budget-mobile

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

  budget-api-db-integration:
    # W38 audit F4 AC2/AC3: the existing `ownership-contract.test.ts`
    # suite mocks Prisma entirely, so real DB-layer bugs (mistyped fields,
    # missing `where`, broken transaction boundaries) silently pass CI.
    # This job runs a parallel test file
    # (`services/budget-api/test/ownership-contract-integration.test.ts`)
    # against the same Postgres service the unit job provisions, with
    # Akahu HTTP stubs so no real outbound network is required. The test
    # self-skips when `BUDGET_API_INTEGRATION_TEST` is unset so local
    # developers running `npm test` against a non-existent DB are not
    # broken. The unit job deliberately does not set this env var.
    name: budget-api db integration (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_budget
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_budget?schema=budget_api
      OTEL_SDK_DISABLED: '1'
      AKAHU_DEV_USER_ACCESS_TOKEN: ''
      BUDGET_API_INTEGRATION_TEST: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/budget-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/budget-api

      - name: Apply DB migrations
        run: npm run prisma:migrate --workspace services/budget-api

      - name: Seed DB
        run: npm run prisma:seed --workspace services/budget-api

      - name: Run ownership-contract integration (real DB)
        # `ownership-contract-integration` TRUNCATEs every domain table in
        # its `beforeAll` to get a clean slate.
        run: npm test --workspace services/budget-api -- --no-file-parallelism ownership-contract-integration

      - name: Run Akahu backfill integration (real DB)
        # `akahuBackfillDb` is the real-Postgres counterpart of the Akahu
        # backfill's AC6 evidence (task a37b31c9): "a second apply creates
        # no duplicates" is a claim about a unique constraint, so it is
        # asserted against the real schema, not a Prisma double.
        #
        # This file also TRUNCATEs every domain table in its `beforeAll`,
        # and it runs in its own vitest invocation on purpose. The two
        # integration files share one Postgres service, and vitest runs test
        # files in parallel workers by default — so when both files ran in
        # one invocation, whichever `beforeAll` landed last wiped the other
        # file's fixtures mid-test, and the backfill's second apply died on a
        # foreign-key violation against a `User` row the sibling file had
        # just deleted. Each file's TRUNCATE + seed now completes before the
        # next file's TRUNCATE, and `--no-file-parallelism` keeps it that way
        # if a file is ever added to one of these invocations.
        run: npm test --workspace services/budget-api -- --no-file-parallelism akahuBackfillDb

  tasks-app-tests:
    name: tasks app tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks

      - name: Run unit/component tests
        run: npm test --workspace apps/tasks

  tasks-app-e2e:
    name: tasks app e2e (ui + api + db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sindustries_tasks
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sindustries_tasks"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Ensure Rollup Linux native binary is present
        run: |
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace apps/tasks
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.59.0 --workspace services/tasks-api

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace services/tasks-api

      - name: Apply DB migrations + seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
        run: |
          npm run prisma:migrate --workspace services/tasks-api
          npm run prisma:seed --workspace services/tasks-api

      - name: Start tasks-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sindustries_tasks?schema=tasks_api
          PORT: 4000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
          ALLOW_PORT_DB_MISMATCH: "1"
          OTEL_SDK_DISABLED: "1"
        run: npm run start --workspace services/tasks-api > /tmp/tasks-api.log 2>&1 &

      - name: Wait for tasks-api
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:4000/health && exit 0
            sleep 2
          done
          echo "tasks-api failed to start"
          cat /tmp/tasks-api.log
          exit 1

      - name: Install Playwright browser + system deps
        run: npm exec --workspace apps/tasks playwright install --with-deps chromium

      - name: Run Playwright e2e
        env:
          CI: true
        run: npm run test:e2e --workspace apps/tasks

      - name: Dump tasks-api logs on failure
        if: failure()
        run: cat /tmp/tasks-api.log

