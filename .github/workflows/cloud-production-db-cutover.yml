# .github/workflows/cloud-production-db-cutover.yml
#
# Production data cutover: the same transfer + restore harness that the
# staging drill runs, against the production environment (task f2c23e26).
#
# workflow_dispatch only — never on push, never on schedule. A production
# data move is an operator action with a deliberate window, not something
# a merge can start.
#
# The source databases are bound to the Mac mini's prodlike Postgres. This
# workflow therefore runs only on that host's dedicated cutover runner; a
# GitHub-hosted runner has no network path to the source endpoint.
#
# THREE INDEPENDENT KEYS must all line up before a single row moves:
#
#   1. The `production` GitHub Environment. Its reviewers are the
#      approval gate; a dispatch that has not been approved cannot start.
#   2. The typed confirmation `MIGRATE PRODUCTION` in the dispatch input.
#      This is what sets CLOUD_DB_PRODUCTION_ACK=1 for the run — the
#      second key the scripts require. A typo cannot start a run.
#   3. The declared endpoints. The operator names every host the run may
#      touch; the scripts refuse any endpoint that is not on that list.
#      The production Neon database is named `neondb`, the same as
#      staging, so the endpoint list is the only thing that can identify
#      the target.
#
# Required secrets (configured on the `production` GitHub Environment):
#   * TASKS_API_SOURCE_DSN    — read-only DSN for source tasks_api
#   * CONTENT_SCHEDULER_API_SOURCE_DSN   — read-only DSN for source content_scheduler
#   * TASKS_API_DEST_DSN      — owner DSN for destination tasks_api
#   * CONTENT_SCHEDULER_API_DEST_DSN     — owner DSN for destination content_scheduler
#   * NEONDB_OWNER_DSN        — the production DATABASE OWNER connection
#                               (neondb_owner). The production schemas are
#                               owned by that role, so DROP SCHEMA and
#                               CREATE SCHEMA are owner-only statements:
#                               run as a service role the cleanup fails
#                               closed with "must be owner of schema", and
#                               run as a service role the restore would
#                               make that role the schema's owner. The
#                               destructive DDL runs on this connection;
#                               the service roles keep their own
#                               DML-scoped connections for the data load.
#   * RECOVERY_TASKS_API_DSN  — owner DSN for the recovery database
#                               (only required when --recovery)
#   * RECOVERY_CONTENT_SCHEDULER_API_DSN — owner DSN for the recovery database
#                               (only required when --recovery)
#
# Runbook: docs/runbooks/production-data-migration-restore.md

name: cloud-production-db-cutover

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type MIGRATE PRODUCTION to confirm this run may move production data.'
        required: true
        type: string
      source_host:
        description: 'host[:port] of the source endpoint (must match the source DSN exactly).'
        required: true
        type: string
      destination_host:
        description: 'host[:port] of the destination endpoint (must match the destination DSN exactly).'
        required: true
        type: string
      recovery:
        description: 'Also restore the migrated data into a recovery database and re-reconcile (AC3 evidence).'
        required: false
        type: boolean
        default: false
      recovery_host:
        description: 'host[:port] of the RECOVERY target endpoint. Required when recovery is true. It must be neither the source nor the destination host — the drill refuses a recovery target that shares a host with either, and it is refused here too.'
        required: false
        type: string
        default: ''
      interruption:
        description: 'Run a single interruption drill: dump, restore, or none. A non-none value leaves a partial artefact in place for forensic inspection.'
        required: false
        type: string
        default: 'none'
      cleanup_destination:
        description: 'DESTRUCTIVE: drop the tasks_api and content_scheduler schemas in the destination before restoring. Only for a destination a previous failed run left behind. Two-key auth: this input plus CLEANUP_DESTINATION=1, which the drill script also requires.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-production-database
  cancel-in-progress: false

jobs:
  cutover:
    name: Production cutover
    runs-on: [self-hosted, macOS, ARM64, self-hosted-production-cutover]
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        shell: /opt/homebrew/bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare the Mac mini toolchain
        run: |
          set -euo pipefail
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          /opt/homebrew/bin/bash --version | grep -q 'version [4-9]\.'
          /opt/homebrew/bin/psql --version | grep -q '18\.'
          /opt/homebrew/bin/pg_dump --version | grep -q '18\.'
          test -x /opt/homebrew/bin/pg_restore
          test -x /opt/homebrew/bin/shellcheck

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install repository deps
        run: npm ci

      - name: Lint cloud database scripts
        run: npm run lint:cloud-db

      - name: Write DSNs to mode-0600 files
        env:
          TASKS_SOURCE: ${{ secrets.TASKS_API_SOURCE_DSN }}
          CONTENT_SCHEDULER_SOURCE: ${{ secrets.CONTENT_SCHEDULER_API_SOURCE_DSN }}
          TASKS_DEST: ${{ secrets.TASKS_API_DEST_DSN }}
          CONTENT_SCHEDULER_DEST: ${{ secrets.CONTENT_SCHEDULER_API_DEST_DSN }}
          NEONDB_OWNER: ${{ secrets.NEONDB_OWNER_DSN }}
          TASKS_RECOVERY: ${{ secrets.RECOVERY_TASKS_API_DSN }}
          CONTENT_SCHEDULER_RECOVERY: ${{ secrets.RECOVERY_CONTENT_SCHEDULER_API_DSN }}
        run: |
          set -euo pipefail
          required=(TASKS_SOURCE CONTENT_SCHEDULER_SOURCE TASKS_DEST CONTENT_SCHEDULER_DEST NEONDB_OWNER)
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            required+=(TASKS_RECOVERY CONTENT_SCHEDULER_RECOVERY)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Required production environment secret for $name is missing or empty" >&2
              exit 11
            fi
          done
          if [[ -z "${NEONDB_OWNER:-}" ]]; then
            echo "NEONDB_OWNER_DSN is required: the production schemas are owned by neondb_owner, so the destructive DDL (DROP SCHEMA) and the schema creation (CREATE SCHEMA) must run on that connection" >&2
            exit 11
          fi
          mkdir -p "$RUNNER_TEMP/cloud-production-secrets"
          chmod 0700 "$RUNNER_TEMP/cloud-production-secrets"
          for pair in \
              "tasks-source:tasks.dsn:$TASKS_SOURCE" \
              "content-scheduler-source:content-scheduler.dsn:$CONTENT_SCHEDULER_SOURCE" \
              "tasks-dest:tasks-dest.dsn:$TASKS_DEST" \
              "content-scheduler-dest:content-scheduler-dest.dsn:$CONTENT_SCHEDULER_DEST"; do
            name="${pair%%:*}"
            rest="${pair#*:}"
            file="${rest%%:*}"
            value="${rest#*:}"
            printf '%s' "$value" > "$RUNNER_TEMP/cloud-production-secrets/$name-$file"
            chmod 0600 "$RUNNER_TEMP/cloud-production-secrets/$name-$file"
          done
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            if [[ -z "${{ inputs.recovery_host }}" ]]; then
              echo "recovery_host is required when recovery is true — the recovery target must be a declared endpoint of its own" >&2
              exit 12
            fi
            if [[ "${{ inputs.recovery_host }}" == "${{ inputs.source_host }}" || "${{ inputs.recovery_host }}" == "${{ inputs.destination_host }}" ]]; then
              echo "recovery_host must differ from source_host and destination_host" >&2
              exit 12
            fi
            printf '%s' "$TASKS_RECOVERY"  > "$RUNNER_TEMP/cloud-production-secrets/tasks-recovery.dsn"
            printf '%s' "$CONTENT_SCHEDULER_RECOVERY" > "$RUNNER_TEMP/cloud-production-secrets/content-scheduler-recovery.dsn"
            chmod 0600 "$RUNNER_TEMP/cloud-production-secrets/tasks-recovery.dsn"
            chmod 0600 "$RUNNER_TEMP/cloud-production-secrets/content-scheduler-recovery.dsn"
          fi
          # The schema-OWNER connection for the destructive DDL. Written
          # like every other credential here: mode 0600, in the runner's
          # temp dir, never in a log line.
          printf '%s' "$NEONDB_OWNER" > "$RUNNER_TEMP/cloud-production-secrets/dest-owner.dsn"
          chmod 0600 "$RUNNER_TEMP/cloud-production-secrets/dest-owner.dsn"

      - name: Pre-flight safety checks
        env:
          CONFIRM: ${{ inputs.confirm_production }}
          SOURCE_HOST: ${{ inputs.source_host }}
          DESTINATION_HOST: ${{ inputs.destination_host }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM" != "MIGRATE PRODUCTION" ]]; then
            echo "confirm_production must be exactly: MIGRATE PRODUCTION" >&2
            exit 10
          fi
          if [[ "$ENVIRONMENT" != "production" ]]; then
            echo "ENVIRONMENT must be production" >&2
            exit 10
          fi
          if [[ -z "$SOURCE_HOST" || -z "$DESTINATION_HOST" ]]; then
            echo "source_host and destination_host are required" >&2
            exit 10
          fi
          if [[ "$SOURCE_HOST" == "$DESTINATION_HOST" ]]; then
            echo "source_host and destination_host must differ" >&2
            exit 10
          fi
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          psql --version | grep -q '18\.'

      - name: Run the cutover
        env:
          CONFIRM: ${{ inputs.confirm_production }}
          SOURCE_HOST: ${{ inputs.source_host }}
          DESTINATION_HOST: ${{ inputs.destination_host }}
          CLOUD_DB_DRILL_INTERRUPTION: ${{ inputs.interruption }}
          CLOUD_DB_PRODUCTION_ACK: ${{ inputs.confirm_production == 'MIGRATE PRODUCTION' && '1' || '' }}
          CLEANUP_DESTINATION: ${{ inputs.cleanup_destination == true && '1' || '' }}
        run: |
          set -euo pipefail
          SEC="$RUNNER_TEMP/cloud-production-secrets"
          RECOVERY_FLAG=""
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            RECOVERY_FLAG="--recovery"
          fi
          CLEANUP_FLAG=""
          if [[ "${{ inputs.cleanup_destination }}" == "true" ]]; then
            CLEANUP_FLAG="--cleanup-destination"
          fi
          RECOVERY_ARGS=()
          RECOVERY_HOST_FLAGS=()
          if [[ "${{ inputs.recovery }}" == "true" ]]; then
            RECOVERY_ARGS=(
              --recovery-tasks-dsn-file "$SEC/tasks-recovery.dsn"
              --recovery-content-scheduler-dsn-file "$SEC/content-scheduler-recovery.dsn"
            )
            # The recovery target is a THIRD endpoint, so it has to be
            # declared like one: the harness refuses any endpoint that
            # is not in the allowlist, and an undeclared recovery host
            # would fail the restore rather than the declaration.
            RECOVERY_HOST_FLAGS=(--expected-host "${{ inputs.recovery_host }}")
          fi
          RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-$(openssl rand -hex 3)"
          export CLOUD_DB_RUN_ID="$RUN_ID"
          # The accepted shared access is DERIVED from the environment
          # manifest, not restated here: a workflow that carried its own
          # copy of the accepted role pair could agree with a drifted
          # topology. When the manifest declares no acceptance, the two
          # exports are empty and the harness refuses cross-schema access
          # exactly as it did before.
          eval "$(node infra/cloud/scripts/print-accepted-shared-access.mjs)"
          ./scripts/cloud/database/drill.sh \
            --source-tasks-dsn-file  "$SEC/tasks-source-tasks.dsn" \
            --source-content-scheduler-dsn-file "$SEC/content-scheduler-source-content-scheduler.dsn" \
            --dest-tasks-dsn-file    "$SEC/tasks-dest-tasks-dest.dsn" \
            --dest-content-scheduler-dsn-file   "$SEC/content-scheduler-dest-content-scheduler-dest.dsn" \
            --dest-owner-dsn-file    "$SEC/dest-owner.dsn" \
            --environment production \
            --expected-host "$SOURCE_HOST" \
            --expected-host "$DESTINATION_HOST" \
            "${RECOVERY_HOST_FLAGS[@]}" \
            --confirm "$RUN_ID" \
            --interruption "${{ inputs.interruption }}" \
            $RECOVERY_FLAG \
            "${RECOVERY_ARGS[@]}" \
            $CLEANUP_FLAG \
            --archive-dir "$RUNNER_TEMP/cloud-production-artifacts" \
            --output      "$RUNNER_TEMP/cloud-production-artifacts/drill-final.json"

      - name: Upload redacted evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-production-db-cutover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloud-production-artifacts/*.json
            ${{ runner.temp }}/cloud-production-artifacts/*.sha256
            ${{ runner.temp }}/cloud-production-artifacts/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Fail if reconcile FAILED
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/cloud-production-artifacts/reconcile-*.json"
          if compgen -G "$f" >/dev/null; then
            latest=$(ls -1t $f | head -n1)
            verdict=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).verdict || 'unknown')" "$latest")
            if [[ "$verdict" != "PASS" ]]; then
              echo "reconcile verdict=$verdict; failing the workflow" >&2
              exit 20
            fi
          fi
