name: x-bookmarks-review-pipeline

# Ingest, summarise, and route bookmarks through the approval pipeline.
#
# Summarize replaces generate_reviews — faithful extraction, no classification.
# Spec generation happens asynchronously in Quinn's heartbeat (spec_requested → spec files).
# This pipeline runs through to the approval gate so the lobster resume token
# is available when Tom approves a spec.

args:
  sourceRoot:
    default: brain/bookmarks
  reviewsRoot:
    default: brain/bookmarks/summaries
  specsRoot:
    default: brain/specs
  limit:
    default: 25
  source:
    default: any
  dryRun:
    default: false
  approvalTopic:
    default: general

steps:
  - id: collect_candidates
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/list_review_candidates.py
      --source-root ${sourceRoot}
      --source ${source}
      --limit ${limit}
      --json

  - id: skip_if_empty
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/ensure_non_empty.py --json
    stdin: $collect_candidates.stdout

  - id: summarize
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/summarize.py
      --reviews-root ${reviewsRoot}
      --json
    stdin: $collect_candidates.stdout

  - id: filter_curation
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/filter_curation.py --json
    stdin: $summarize.stdout

  - id: generate_specs
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/generate_specs.py
      --specs-root ${specsRoot}
      --json
    stdin: $filter_curation.stdout

  - id: build_task_proposals
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/build_task_proposals.py --json
    stdin: $generate_specs.stdout

  - id: prepare_topic_approval
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/prepare_topic_approval.py
      --approval-topic ${approvalTopic}
      --json
    stdin: $build_task_proposals.stdout

  - id: ensure_topic_slot_available
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/ensure_topic_slot_available.py --json
    stdin: $prepare_topic_approval.stdout

  - id: finalize_non_approval
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/finalize_review_cycle.py --json
    stdin: $ensure_topic_slot_available.stdout

  - id: approval_gate
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/compact_approval_preview.py
    stdin: $ensure_topic_slot_available.stdout
    approval: required

  - id: create_tasks
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/create_tasks_from_proposals.py
      --base-url ${TASKS_API_BASE_URL}
      --json
    stdin: $ensure_topic_slot_available.stdout
    condition: $approval_gate.approved

  - id: resolve_approved
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/resolve_topic_approval.py
      --decision approve
      --json
    stdin: $create_tasks.stdout
    condition: $approval_gate.approved
