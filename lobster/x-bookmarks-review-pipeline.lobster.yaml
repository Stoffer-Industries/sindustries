name: x-bookmarks-review-pipeline

# Ingest and summarise new bookmarks.
# Pipeline ends here — curation, spec generation, and approval
# are handled by Quinn's heartbeat (curate.py → spec dispatch).

args:
  sourceRoot:
    default: brain/bookmarks
  reviewsRoot:
    default: brain/reviews
  limit:
    default: 25
  source:
    default: any

steps:
  - id: collect_candidates
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/list_review_candidates.py
      --source-root ${sourceRoot}
      --source ${source}
      --limit ${limit}
      --json

  - id: skip_if_empty
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/ensure_non_empty.py --json
    stdin: $collect_candidates.stdout

  - id: summarize
    command: >-
      python3 codebases/sindustries/agents/workflows/bookmark/summarize.py
      --reviews-root ${reviewsRoot}
      --json
    stdin: $collect_candidates.stdout
