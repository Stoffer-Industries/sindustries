receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Derive Prometheus RED-style metrics from traces (used by Grafana dashboard requests-overview).
connectors:
  spanmetrics:
    dimensions:
      - name: llm.model
      - name: agent_id
      - name: selection.listener
      - name: http.method
      - name: http.status_code
      # Stable HTTP semconv (OTel 1.23+); Plano/filter spans often only set this, not legacy http.status_code.
      - name: http.response.status_code
      # OpenClaw gateway (v0.115+) emits per-tool-call spans (`openclaw.tool.execution`)
      # with this GenAI semconv attribute on every tool invocation. Surfacing it here unlocks
      # a `gen_ai_tool_name` label on traces_span_metrics_calls_total so the Grafana dashboard
      # can break down tool activity by tool name. Used together with the legacy
      # `openclaw.toolName` attribute as a fallback for spans missing the semconv attribute.
      - name: gen_ai.tool.name
      - name: openclaw.toolName
    # Record span duration in seconds (OTel semconv). Without wide enough buckets, LLM spans
    # all land in +Inf and histogram_quantile clamps to the last finite le (~10ms).
    histogram:
      unit: s
      explicit:
        buckets:
          - 10ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2s
          - 5s
          - 10s
          - 30s
          - 60s
          - 120s
          - 300s
          - 600s
          - 1800s

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Gateway agent attribution (task a7938522, AC4).
  #
  # The OpenClaw gateway exports the agent that owns a run as the span
  # attribute `openclaw.agent` — documented in OpenClaw's own reference
  # (docs/gateway/opentelemetry/spans-and-events.md: `openclaw.model.call`
  # carries "optional `openclaw.agent` (the agent that owns the run when
  # known)"). It never exports `agent_id`, which is the name this repo's
  # spanmetrics connector uses as its agent dimension. Live tenant evidence
  # (2026-11-17) showed the gateway's model-call series landing in Grafana
  # Cloud with `agent_id=null`: the spans arrived, the dimension did not.
  #
  # This mapping fills the missing dimension from the attribute the gateway
  # already sends, so the spanmetrics series and the exported spans carry the
  # same agent label the dashboards query.
  #
  # Fill-if-absent on purpose: repo-owned emitters (the bookmarks workflow,
  # the health-probe relay) stamp `agent_id` themselves, and their value must
  # win. `error_mode: ignore` keeps a malformed statement from dropping
  # telemetry — a missing `agent_id` dimension is a reporting gap, not a
  # reason to lose the span.
  transform/gateway_agent_id:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["agent_id"], attributes["openclaw.agent"]) where attributes["openclaw.agent"] != nil and attributes["agent_id"] == nil
  # Cardinality trim (2026-11-16): the OpenClaw gateway's own RPC-pipeline
  # histograms (admission/handler/first-response/queue-wait timing, each
  # broken down per agent/session) are internal plumbing detail that no
  # dashboard in this repo reads (verified: no `gateway_rpc` reference in
  # infra/cloud/observability/grafana/dashboards/). Alone they were ~3,364 of
  # the ~12,203 active series that pushed the Grafana Cloud free tier (10k)
  # over its limit the day after the local->cloud cutover (task a7938522) —
  # these metrics were previously free on the local, cap-free Prometheus and
  # only started counting once the collector started exporting to the metered
  # tenant. Dropped here rather than at the source so OpenClaw's own gateway
  # code and local dev visibility (`:8888` self-telemetry) are unaffected.
  filter/drop_high_cardinality_gateway_rpc:
    error_mode: ignore
    metrics:
      metric:
        - 'name == "openclaw_gateway_rpc_admission_ms_milliseconds_bucket"'
        - 'name == "openclaw_gateway_rpc_handler_ms_milliseconds_bucket"'
        - 'name == "openclaw_gateway_rpc_first_response_ms_milliseconds_bucket"'
        - 'name == "openclaw_gateway_rpc_queue_wait_ms_milliseconds_bucket"'

exporters:
  # Grafana Cloud is the telemetry destination for every local span and metric.
  # The collector stays the single local OTLP receiver; only the forwarding
  # target changed.
  #
  # The endpoint is the `/otlp`-prefixed gateway path, so the exporter posts to
  # `<endpoint>/v1/traces`. Both values are exported into the collector's
  # process environment by `scripts/dev/grafana-cloud-otel-env.sh`.
  #
  # Never interpolate `GRAFANA_CLOUD_OTLP_HEADERS` here. That value is an OTLP
  # exporter header *string* (`Authorization=Basic <base64>`), not a header
  # value; using it directly would send `Authorization: Authorization=Basic …`
  # and the tenant would answer 401. The helper parses it into a real
  # Authorization value first.
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      Authorization: ${env:GRAFANA_CLOUD_OTLP_AUTHORIZATION}
    sending_queue:
      enabled: true
    retry_on_failure:
      enabled: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/gateway_agent_id, batch]
      exporters: [otlphttp/grafana_cloud, spanmetrics]
    metrics:
      receivers: [otlp]
      processors: [batch, filter/drop_high_cardinality_gateway_rpc]
      exporters: [otlphttp/grafana_cloud]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [otlphttp/grafana_cloud]
