# spa-nginx.conf — Vite-built SPA static serve + healthz endpoint.
#
# Shared by `mission-control.Dockerfile` and `tasks-app.Dockerfile`. SPA
# fallback rewrites unknown paths to /index.html so client-side routing
# works on hard reloads (e.g., refreshing on /tasks/abc-123 deep-links).
#
# Why a separate file rather than inline heredoc in each Dockerfile:
#   - one place to change SPA fallback, gzip, cache headers, or healthz
#   - syntax-checked by `nginx -t` in the runtime image (see Dockerfile CMD)
#   - the same config can be reused for any future Vite/React static SPA
#
# Health endpoint: `/healthz` returns 200 with a tiny body. Fly's
# http_check targets this path; the body is short enough to fit in a
# single TCP packet so we don't pay any extra RTT cost vs /healthz with
# no body.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # gzip assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback — any unmatched path falls back to /index.html so the
    # client-side router can handle the route. Without this, hard
    # refreshes on deep links (e.g., /tasks/<uuid>) return 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed asset bundles (Vite emits
    # /assets/index-<hash>.js, /assets/index-<hash>.css). index.html stays
    # short-cached so deploys roll forward immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoint — Fly http_check targets this. Returns 200 with a
    # tiny body so the check verifies the server is alive AND serving
    # HTTP, not just that the port is open.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Don't serve dotfiles (.git, .env, …). Defense in depth — these
    # shouldn't be in the dist/ output but explicit deny is cheap.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
}
