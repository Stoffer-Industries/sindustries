# nginx.conf — in-container router for the consolidated Fly staging platform
# (task 219fb673).
#
# WHY THIS EXISTS
# ---------------
# One Fly app can claim external port 443 only once, but the three public
# service surfaces keep their existing URLs (AC2: "remain reachable on their
# existing routes"). A `[[services]]` block per service is therefore not
# possible on one app: a second block on 443 is rejected, and consumers use
# plain `https://<host>/...` URLs on 443.
#
# So the app exposes ONE service (443 -> 8080) and this router dispatches
# on the Host header to the three loopback listeners the supervisor owns.
# The application code of all three services is untouched; only the traffic
# entry point moved.
#
# The stable staging hostnames do not resolve yet (they need a Cloudflare
# Zone:DNS:Edit token that only Tom holds — task 5cb4a8fe), so the router
# ALSO exposes path-prefix routes on the provider hostname. That keeps the
# platform usable and testable while DNS is blocked, and it is the interim
# proof path used by the AC2 verification matrix.
#
# Host-routing is matched on the Host header, which nginx sees regardless of
# whether the hostname resolves in DNS — so these blocks work the moment the
# CNAME lands, with no config change.
#
# LOGS
# ----
# Access and error logs go to stdout/stderr so Fly's log collector picks
# them up; there is no log file to rotate inside the container.

worker_processes auto;

# `stderr` (not /dev/stderr) makes nginx log on the inherited fd 2 directly.
# The supervisor spawns every child with PIPED stdio, and in that context
# opening /dev/stderr fails with
#   nginx: [emerg] open() "/dev/stderr" failed (6: No such device or address)
# so the router exits before it can bind :8080 and the platform is
# unreachable through fly-proxy.
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # `stdout` (not /dev/stdout) for the same reason as error_log above:
    # the supervisor gives the child a pipe, not a device node.
    access_log stdout;
    include /etc/nginx/mime.types;

    # The server names below reach 47 characters
    # ("content-scheduler-api.staging.sindustries.co.nz"). nginx's default
    # server_names_hash_bucket_size of 64 cannot hold them, and the router
    # then refuses to start with
    #   nginx: [emerg] could not build server_names_hash, you should
    #   increase server_names_hash_bucket_size: 64
    # so the platform never binds :8080. 128 is the smallest power of two
    # that holds every server name in this file.
    server_names_hash_bucket_size 128;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    # Temp paths under /tmp so the container needs no writable /var/lib/nginx.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The four children run on loopback inside the same Machine.
    upstream tasks_api {
        server 127.0.0.1:4001;
        keepalive 16;
    }

    upstream budget_api {
        server 127.0.0.1:4002;
        keepalive 16;
    }

    upstream content_scheduler_api {
        server 127.0.0.1:4003;
        keepalive 16;
    }

    # The supervisor's status endpoint (loopback only, 127.0.0.1:8081).
    upstream platform_supervisor {
        server 127.0.0.1:8081;
    }

    # ------------------------------------------------------------------
    # Stable hostname -> service.
    # ------------------------------------------------------------------
    server {
        listen 8080;
        server_name tasks-api.staging.sindustries.co.nz;

        location = /__status {
            proxy_pass http://platform_supervisor/status;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://tasks_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 8080;
        server_name budget-api.staging.sindustries.co.nz;

        location = /__status {
            proxy_pass http://platform_supervisor/status;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://budget_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 8080;
        server_name content-scheduler-api.staging.sindustries.co.nz;

        location = /__status {
            proxy_pass http://platform_supervisor/status;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://content_scheduler_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }
    }

    # ------------------------------------------------------------------
    # Provider hostname — path-prefix fallback while DNS is blocked.
    #
    #   /tasks-api/*            -> 127.0.0.1:4001/*
    #   /budget-api/*           -> 127.0.0.1:4002/*
    #   /content-scheduler-api/* -> 127.0.0.1:4003/*
    #
    # The trailing slash on proxy_pass strips the matched prefix, so
    # /tasks-api/health is proxied as /health.
    # ------------------------------------------------------------------
    server {
        listen 8080 default_server;
        server_name sindustries-platform-staging.fly.dev;

        location = /__status {
            proxy_pass http://platform_supervisor/status;
            proxy_set_header Host $host;
        }

        location = /tasks-api {
            return 308 /tasks-api/;
        }

        location /tasks-api/ {
            proxy_pass http://tasks_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location = /budget-api {
            return 308 /budget-api/;
        }

        location /budget-api/ {
            proxy_pass http://budget_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        location = /content-scheduler-api {
            return 308 /content-scheduler-api/;
        }

        location /content-scheduler-api/ {
            proxy_pass http://content_scheduler_api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
        }

        # The auto-post worker is queue-bound and has no HTTP surface. Any
        # path that is not one of the three service prefixes is a 404 — it
        # must never fall through to a service.
        location / {
            default_type application/json;
            return 404 '{"error":"not_found","platform":"sindustries-platform-staging","hint":"use /tasks-api/, /budget-api/ or /content-scheduler-api/"}';
        }
    }
}
