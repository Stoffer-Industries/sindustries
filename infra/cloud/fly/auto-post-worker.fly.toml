# fly.toml — auto-post-worker staging.
#
# RETIRED — the per-service staging Fly app this spec configures was destroyed
# in the 2026-11-07 staging consolidation. The worker now runs as a child
# process of the ONE consolidated staging platform app; the live staging deploy
# path is `infra/cloud/fly/platform.fly.toml` via
# `.github/workflows/deploy-staging-platform.yml`. This file is retained as a
# historical template only and MUST NOT be deployed — the retired-app guard in
# `infra/cloud/scripts/tests/retired-staging-apps.test.sh` asserts that no
# operator surface deploys it. Live topology: `docs/systems/cloud-platform.md`;
# cutover and pending cleanup: `docs/runbooks/platform-consolidation-rollback.md`.
#
# Stable hostname (task 5cb4a8fe; source of truth: infra/cloud/hostname-matrix.json):
#   staging:    (none) — queue-bound, not HTTP-bound
#   production: (none) — queue-bound, not HTTP-bound
# This surface has NO public URL by design. Health is observed via
# GET /api/v1/content-scheduler/auto-post/health on the content-scheduler-api
# stable hostname, not via a separate worker hostname. The matrix's worker row
# records this rule so future operators cannot add a worker hostname by mistake.
#
# Long-running BullMQ queue consumer. NOT an HTTP service — Quinn's
# APPROVED review on PR #508 (docs/specs/cloud-deployment-foundation-tech-design.md)
# confirmed the worker ran as a SEPARATE Fly app process (no sidecar in
# tasks-api), with no [http_service] section and no http_checks. Since the
# 2026-11-07 consolidation the same worker code runs as a child process of the
# consolidated staging platform app, supervised by
# `infra/cloud/platform/platform-supervisor.mjs` rather than by a per-app Fly
# process supervisor.
#
# The build context is set to the repo root (`../../..`) so the
# Dockerfile's `COPY services/content-scheduler-api/` references resolve
# cleanly. The worker is sourced from services/content-scheduler-api/
# (file: src/workers/autoPostWorkerMain.ts) — Quinn's review explicitly
# approved "implementation PRs can stack on top" of the 94d5e4fc content
# scheduler extraction, so this Fly app spec does NOT depend on the
# worker being extracted to a standalone service.
#
# Pre-consolidation answers from PR #508 (locked then; superseded by the
# 2026-11-07 cutover named above — retained for history only):
#   - Worker placement: was a SEPARATE Fly app process (this file).
#   - REDIS_URL: stays as the env-var contract — Upstash credentials
#     (Sydney, TLS) are Quinn-supplied and referenced by secret name only.
#   - .openclaw boundary: Quinn owns Fly.io API token, Neon connection
#     string, Upstash credentials, and the DNS provider token. This file
#     references secret names only — no live values committed.

app = 'sindustries-auto-post-worker-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  # `context` is resolved relative to this fly.toml at `infra/cloud/fly/`,
  # so `../../..` is the repo root. Pin to repo root for Docker COPY paths.
  context = '../../..'
  dockerfile = '../docker/auto-post-worker.Dockerfile'

[env]
  NODE_ENV = 'production'
  # BullMQ is the production adapter per Quinn-approved PR #508 and the
  # task 1945f8a2 prodlike flip. CONTENT_SCHEDULER_JOB_ADAPTER=in-process
  # would survive the worker's lifetime but not restart — unfit for cloud.
  CONTENT_SCHEDULER_JOB_ADAPTER = 'bullmq'
  # Reconciliation sweep + the BullMQ adapter use Prisma; DATABASE_URL is
  # supplied at deploy time via `fly secrets set` (Quinn-owned).

[processes]
  # Single-process worker. Scaling horizontally (more workers) is a future
  # concern — BullMQ handles concurrent job dispatch across replicas when
  # we get there. For staging, one worker is enough.
  worker = 'node --require @sindustries/otel-node/register --import tsx services/content-scheduler-api/src/workers/autoPostWorkerMain.ts'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[deploy]
  # canary matches the WS1 baseline (tasks-api, budget-api). The worker
  # has no http_service so the canary strategy manifests as a single
  # new machine brought up alongside the prior release; Fly promotes it
  # once it's healthy. For rollback: `fly releases rollback <v>` (see
  # docs/runbooks/cloud-deployment-rollback.md, planned in WS3).
  strategy = 'canary'
