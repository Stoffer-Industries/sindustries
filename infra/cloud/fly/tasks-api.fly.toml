# fly.toml — tasks-api staging.
#
# RETIRED — the per-service staging Fly app this spec configures was destroyed
# in the 2026-11-07 staging consolidation. The service now runs as a child
# process of the ONE consolidated staging platform app; the live staging deploy
# path is `infra/cloud/fly/platform.fly.toml` via
# `.github/workflows/deploy-staging-platform.yml`. This file is retained as a
# historical template only and MUST NOT be deployed — the retired-app guard in
# `infra/cloud/scripts/tests/retired-staging-apps.test.sh` asserts that no
# operator surface deploys it. Live topology: `docs/systems/cloud-platform.md`;
# cutover and pending cleanup: `docs/runbooks/platform-consolidation-rollback.md`.
#
# Stable hostnames (task 5cb4a8fe; source of truth: infra/cloud/hostname-matrix.json):
#   staging:    tasks-api.staging.sindustries.co.nz
#   production: tasks-api.sindustries.co.nz
# The staging certificate is added to the consolidated platform app instead:
# `fly certs add tasks-api.staging.sindustries.co.nz --app sindustries-platform-staging`
# (Quinn-owned operator step; the cert is auto-issued by Let's Encrypt once the CNAME lands).
#
# Mirror of services/gymtrack-mcp/fly.toml with the staging-specific app name,
# primary_region kept at 'syd' (matches the existing gymtrack-mcp precedent and
# Tom/Quinn geography), and the internal_port pinned to 4001 to match the
# prodlike pairing in services/tasks-api/src/server.ts (PORT=4001 → DB port 7432).
#
# The build context is set to the repo root (`../../..`) so the Dockerfile's
# `COPY pnpm-lock.yaml` / `COPY services/tasks-api/` references resolve cleanly.
# (The `[build]` section below carries the corrected value: the earlier `../../`
# resolved to `infra/` — silently wrong.)
#
# Pre-consolidation rationale (PR #508 — superseded by the 2026-11-07 cutover
# named above; retained for history only):
#   - auto-post-worker was a SEPARATE Fly app process (this file is tasks-api only;
#     the worker got its own fly.toml in infra/cloud/fly/auto-post-worker.fly.toml
#     in PR #3).
#   - REDIS_URL stays as the env-var contract — Upstash credentials (Sydney, TLS)
#     are Quinn-supplied and referenced by secret name only.

app = 'sindustries-tasks-api-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  # `context` is resolved relative to this fly.toml at `infra/cloud/fly/`,
  # so `../../..` is the repo root. The previous `../../` resolved to
  # `infra/` — silently wrong. Pin to repo root for Docker COPY paths.
  context = '../../..'
  dockerfile = '../docker/tasks-api.Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4001'
  ALLOW_PORT_DB_MISMATCH = '1'
  # Stable CORS origins for browser-originated requests (task 5cb4a8fe slice 2).
  # Source of truth: infra/cloud/hostname-matrix.json. Frontend consumers of
  # tasks-api are tasks-app and mission-control; values are the matrix staging
  # hostnames. Production wiring follows once the production hostnames are
  # provisioned (slice 5; AC6). See services/tasks-api/src/app.ts and
  # services/tasks-api/src/config/env.ts for the CsvList consumer.
  CORS_ALLOWED_ORIGINS = 'https://tasks.staging.sindustries.co.nz,https://mission-control.staging.sindustries.co.nz'

[http_service]
  internal_port = 4001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  # Tasks-api mounts the health route at `/health` (services/tasks-api/src/routes/health.ts
  # + services/tasks-api/src/app.ts). The Fly http_check targets the actual route, not a
  # separate `/healthz` endpoint — no application code change required.
  path = '/health'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
  # Fly executes release_command directly, not through a shell, so shell
  # builtins such as `cd` are not available. Run the service-owned workspace
  # script from /app; npm selects the correct Prisma schema for this service.
  release_command = 'npm run prisma:migrate --workspace services/tasks-api'
