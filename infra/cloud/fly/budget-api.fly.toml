# fly.toml — budget-api staging.
#
# Stable hostnames (task 5cb4a8fe; source of truth: infra/cloud/hostname-matrix.json):
#   staging:    budget-api.staging.sindustries.co.nz
#   production: budget-api.sindustries.co.nz
# Add via `fly certs add budget-api.staging.sindustries.co.nz --app sindustries-budget-api-staging`
# (Quinn-owned operator step; the cert is auto-issued by Let's Encrypt once the CNAME lands).
#
# Mirror of infra/cloud/fly/tasks-api.fly.toml with the staging-specific app
# name and the internal_port pinned to 4002 to match services/budget-api/src/server.ts
# (PORT defaults to 4002). primary_region kept at 'syd' to match the existing
# tasks-api and gymtrack-mcp precedent (Tom/Quinn geography).
#
# The build context is set to the repo root (`../../`) so the Dockerfile's
# `COPY pnpm-lock.yaml` / `COPY services/budget-api/` references resolve cleanly.
# When invoking from CI: `fly deploy --config infra/cloud/fly/budget-api.fly.toml`
# from the repo root.
#
# Quinn-approved answers from PR #508:
#   - auto-post-worker is a SEPARATE Fly app process (this file is budget-api only;
#     the worker gets its own fly.toml in infra/cloud/fly/auto-post-worker.fly.toml
#     in PR #3).
#   - REDIS_URL stays as the env-var contract — Upstash credentials (Sydney, TLS)
#     are Quinn-supplied and referenced by secret name only.

app = 'sindustries-budget-api-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  # `context` is resolved relative to this fly.toml at `infra/cloud/fly/`,
  # so `../../..` is the repo root. The previous `../../` resolved to
  # `infra/` — which happened to work only because Fly was then asked to
  # read `infra/cloud/docker/budget-api.Dockerfile` from inside `infra/`,
  # i.e. `infra/infra/cloud/docker/budget-api.Dockerfile` (silently wrong
  # when the parent CI runner's working dir rescued it). Pin to the repo
  # root so Docker COPY paths resolve under all invocation forms.
  context = '../../..'
  dockerfile = '../docker/budget-api.Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4002'
  # Stable CORS origins for browser-originated requests (task 5cb4a8fe slice 2).
  # Source of truth: infra/cloud/hostname-matrix.json. The browser-side consumer
  # of budget-api is mission-control; budget-mobile is a native client with its
  # own auth path and is not in the CORS scope. Production wiring follows once
  # the production hostnames are provisioned (slice 5; AC6). See
  # services/budget-api/src/app.ts for the CsvList consumer.
  CORS_ALLOWED_ORIGINS = 'https://mission-control.staging.sindustries.co.nz'

[http_service]
  internal_port = 4002
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  # Budget-api mounts the health route at `/health` (services/budget-api/src/app.ts).
  # The Fly http_check targets the actual route, not a separate `/healthz` endpoint
  # — no application code change required.
  path = '/health'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
  # Fly executes release_command directly, not through a shell, so shell
  # builtins such as `cd` are not available. Run the service-owned workspace
  # script from /app; npm selects the correct Prisma schema for this service.
  release_command = 'npm run prisma:migrate --workspace services/budget-api'
