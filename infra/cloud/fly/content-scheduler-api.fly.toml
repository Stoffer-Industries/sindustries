# fly.toml — content-scheduler-api staging.
#
# Stable hostnames (task 5cb4a8fe; source of truth: infra/cloud/hostname-matrix.json):
#   staging:    content-scheduler-api.staging.sindustries.co.nz
#   production: content-scheduler-api.sindustries.co.nz
# Add via `fly certs add content-scheduler-api.staging.sindustries.co.nz --app sindustries-content-scheduler-api-staging`
# (Quinn-owned operator step; the cert is auto-issued by Let's Encrypt once the CNAME lands).
#
# The HTTP API and auto-post worker are separate Fly apps but share the
# content_scheduler database schema and BullMQ queue. This app owns the HTTP
# routes; infra/cloud/fly/auto-post-worker.fly.toml owns queue consumption.

app = 'sindustries-content-scheduler-api-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  context = '../../..'
  dockerfile = '../docker/content-scheduler-api.Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4003'
  CONTENT_SCHEDULER_JOB_ADAPTER = 'bullmq'
  # Stable CORS origins for browser-originated requests (task 5cb4a8fe slice 2).
  # Source of truth: infra/cloud/hostname-matrix.json. The browser-side consumer
  # of content-scheduler-api is mission-control (ContentSchedulerTab in
  # apps/mission-control/src/tabs/); tasks-api has no in-app content-scheduler
  # surface. Production wiring follows once the production hostnames are
  # provisioned (slice 5; AC6). See services/content-scheduler-api/src/app.ts
  # and services/content-scheduler-api/src/config/env.ts for the CsvList consumer.
  CORS_ALLOWED_ORIGINS = 'https://mission-control.staging.sindustries.co.nz'

[processes]
  content-scheduler-api = 'npm run start --workspace services/content-scheduler-api'

[http_service]
  internal_port = 4003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['content-scheduler-api']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
  release_command = 'npm run prisma:migrate --workspace services/content-scheduler-api'
