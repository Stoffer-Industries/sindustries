# fly.toml — content-scheduler-api staging.
#
# The HTTP API and auto-post worker are separate Fly apps but share the
# content_scheduler database schema and BullMQ queue. This app owns the HTTP
# routes; infra/cloud/fly/auto-post-worker.fly.toml owns queue consumption.

app = 'sindustries-content-scheduler-api-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  context = '../../..'
  dockerfile = '../docker/content-scheduler-api.Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '4003'
  CONTENT_SCHEDULER_JOB_ADAPTER = 'bullmq'

[processes]
  content-scheduler-api = 'npm run start --workspace services/content-scheduler-api'

[http_service]
  internal_port = 4003
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['content-scheduler-api']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[http_service.checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  path = '/health'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
  release_command = 'npm run prisma:migrate --workspace services/content-scheduler-api'
