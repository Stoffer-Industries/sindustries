# fly.toml — tasks-app staging.
#
# Sibling of `mission-control.fly.toml` (sindustries-mission-control-staging)
# but for the standalone Vite-built Tasks app. Same multi-region/syd,
# same nginx-served SPA pattern, same healthcheck.
#
# Why this is a SEPARATE Fly app (not co-located behind Mission Control):
#   - iframe architecture decision (docs/systems/mission-control.md) is
#     built on independent deploy cadence — see the rationale comment in
#     `infra/cloud/docker/tasks-app.Dockerfile`.
#   - revert granularity (AC3): a Tasks-app regression should be
#     revertable without touching Mission Control.
#
# When invoking from CI:
#   fly deploy \
#     --config infra/cloud/fly/tasks-app.fly.toml \
#     --build-arg VITE_TASKS_API_BASE_URL=https://sindustries-tasks-api-staging.fly.dev/api/v1 \
#     --build-arg VITE_SHELL_ORIGIN=https://sindustries-mission-control-staging.fly.dev
#
# VITE_SHELL_ORIGIN should be the Mission Control staging URL so the
# Tasks app's cross-origin postMessage allowlist accepts messages from
# the iframe parent.

app = 'sindustries-tasks-app-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  context = '../../..'
  dockerfile = 'infra/cloud/docker/tasks-app.Dockerfile'

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[services.http_checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  path = '/healthz'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
