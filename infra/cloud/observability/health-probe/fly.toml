# fly.toml — health-probe staging.
#
# Owns the database / app / Redis health metrics emitted into Grafana
# Cloud. Single machine, canary deploys, http_check targets the probe's
# own /healthz endpoint. Quinn-owned secrets (DATABASE_URLs, Fly app
# URLs, Redis URL, OTLP endpoint + headers) are referenced by name
# only; live values land via `fly secrets set`.
#
# Build context: the repo root (../../../../) so the Dockerfile's
# `COPY package-lock.json package.json ./` resolves correctly when
# invoked as `fly deploy --config infra/cloud/observability/health-probe/fly.toml`
# from the repo root.
#
# Quinn-approved answers from docs/specs/hosted-observability-migration-alerts-tech-design.md:
#   - Health probe is a separate Fly app, not a sidecar of existing services.
#   - One machine is sufficient for staging (the canary failure mode is
#     documented in the tech design's Open Question 5).
#   - Secrets are set per-app, never baked into the image.

app = 'sindustries-health-probe-staging'
primary_region = 'syd'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  context = '../../../../..'
  dockerfile = 'infra/cloud/observability/health-probe/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '9090'
  PROBE_INTERVAL_SECONDS = '30'

[http_service]
  internal_port = 9090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[services.http_checks]]
  interval = '15s'
  timeout = '2s'
  grace_period = '20s'
  method = 'GET'
  path = '/healthz'
  protocol = 'http'
  tls_skip_verify = false

[deploy]
  strategy = 'canary'
