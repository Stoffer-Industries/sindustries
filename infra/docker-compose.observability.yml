# Project name and host ports are set per-mode by mode-env.sh / Tiltfile.
#
# Grafana Cloud is the telemetry destination (task a7938522). The collector is
# the single local OTLP receiver and forwards every span and metric to the
# tenant; the local Tempo, Prometheus and Grafana services were decommissioned
# once the live cloud-ingestion gate passed.
#
# The collector's export credentials come from `infra/cloud/observability/.env.local`
# and are resolved into the two environment variables below by
# `scripts/dev/grafana-cloud-otel-env.sh`, which the supported startup path
# (`make up` / `scripts/dev/up.sh`) runs before the stack comes up.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otel-collector/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    # Grafana Cloud export credentials. These are exported into the process
    # environment by `scripts/dev/grafana-cloud-otel-env.sh`, which the
    # supported startup path (`make up` / `scripts/dev/up.sh`) runs before the
    # stack comes up. Starting this compose file directly requires the same
    # two variables to be set, or the collector has no cloud endpoint to
    # forward to.
    environment:
      GRAFANA_CLOUD_OTLP_ENDPOINT: "${GRAFANA_CLOUD_OTLP_ENDPOINT:-}"
      GRAFANA_CLOUD_OTLP_AUTHORIZATION: "${GRAFANA_CLOUD_OTLP_AUTHORIZATION:-}"
    restart: unless-stopped
